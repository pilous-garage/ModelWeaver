name: installer
version: 0.1.0
description: Agent de chat pour l'installateur/dashboard
parent: agent-as-service

launch:
  mode: agent

supervisor:
  restart: false
  interval: 5

health:
  type: pid

entrypoints:
  chat:
    type: agent-chat
    description: Envoyer un message à l'agent installateur
  execute:
    type: agent-execute
    description: Exécuter une requête sur l'agent installateur
    entrypoint: main
  status:
    type: inline
    handler: |
      def handler(params):
          return {"name": "chat:installer", "status": "running", "role": "chat"}

agent:
  role: chat
  occupation: continue
  config:
    description: Agent de chat pour la fenêtre installateur/dashboard
