name: llm-code
version: 0.1.0
description: >-
  Team llm-code : le swarm exposé comme un modèle LLM (swarm-as-llm).
  L'endpoint /v1/chat/completions branche cette team (workspace mw-llm-code) :
  le pilote planifie/découpe, les greedy (analyse/code/test/review/merge)
  exécutent. Voir docs/swarm_as_llm.md + route test-benchmark-auto.
workspace_id: mw-llm-code
project_id: mw-swarm
topology: flat

# Pilote (team_leader) : planifie + découpe en tâches workspace, surveille.
# occupation noncontinue : il tourne à la demande (via swarm-as-llm), pas en
# boucle greedy.
director:
  agent_name: chat-pilot
  ref: chat-pilot
  role: team_leader
  occupation: noncontinue
  resources:
    llm: true
  provider_ref: ""
  model_ref: ""

members:
  # ── ENTRY/EXIT du swarm-as-llm (sans LLM) : crée la tâche d'entrée et
  # remonte le respond final. Noncontinue : appelé à la demande. ──
  - agent_name: as-llm-leader
    ref: as-llm-leader
    role: team_leader
    occupation: noncontinue
    resources:
      llm: false

  # ── DÉCOUPEUR : découpe les demandes en tâches. Déclare son sous-agent
  # EXPLORATEUR (par référence) : instancié avec le home du découpeur. ──
  - agent_name: decoupeur
    ref: greedy-decoupeur
    role: architecte
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true

  # ── CODEURS : produisent le code (difficulté variable) ──
  - agent_name: coder-junior
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true
  - agent_name: coder-senior
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true

  # ── TEST / REVIEW / MERGE : validations et intégration ──
  - agent_name: tester
    ref: greedy-tester
    role: test_runner
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true
  - agent_name: reviewer
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true
  - agent_name: merger
    ref: greedy-merger
    role: orchestrateur
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true

  # ── PREPARE-RESPONSE : assemble le livrable final (txt + tool_calls + json) ──
  - agent_name: prepare-response
    ref: greedy-prepare-response
    role: prepare_response
    occupation: continue
    resources:
      llm: true
    sub_agents:
      - agent_name: explore
        ref: greedy-explore
        role: explorateur
        occupation: continue
        resources:
          llm: true

resources:
  budget_per_hour: 100
  max_concurrent: 8
  llm_quota_per_day: 1000

# ── Task_supervisor : tableau de règles (in_type, in_tag) → (out_type, out_tag) ──
# OBLIGATOIRE (V0.15 taskflow). Le supervisor applique ces règles mécaniquement
# (sans LLM) : quand une sub_task est done/cancelled avec un tag, il crée la
# sub_task de sortie (avec dépendance) et passe le groupe complet en supervised.
# out_type vide = pas de création (le noeud est terminal → supervised).
supervisor_rules:
  - {in_type: analysis, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: coding, in_tag: done/ok, out_type: review, out_tag: ""}
  - {in_type: coding, in_tag: done/failure, out_type: analysis, out_tag: ""}
  - {in_type: coding, in_tag: done/need_split, out_type: analysis, out_tag: ""}
  - {in_type: review, in_tag: ok, out_type: testing, out_tag: ""}
  - {in_type: review, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: testing, in_tag: ok, out_type: merge, out_tag: ""}
  - {in_type: testing, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: merge, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: merge, in_tag: conflict, out_type: coding, out_tag: ""}
