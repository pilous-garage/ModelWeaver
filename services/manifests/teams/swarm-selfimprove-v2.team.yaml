name: swarm-selfimprove-v2
version: 0.2.0
description: "Swarm glouton parallèle — les agents piochent les tâches du workspace (greedy), se rendorment si rien à faire, réveillés par le wake_up par tâche. Issue → analyste (découpe en tâches) → codeurs (junior/senior selon difficulté) → reviewers/testers → merger. Pas de leader central."
workspace_id: mw-swarm
topology: flat

members:
  # ── Analyste : pioche une issue, la découpe en tâches (difficulty + rôle) ──
  - agent_name: analyst
    role: architecte
    occupation: continue
    resources:
      llm: true

  # ── Codeurs : piochent les tâches selon la difficulté ──
  # coder-a/b : traitent les tâches easy/medium (coder_junior)
  # coder-c : traite les tâches hard/expert (coder_senior)
  - agent_name: coder-a
    role: codeur
    occupation: continue
    resources:
      llm: true
  - agent_name: coder-b
    role: codeur
    occupation: continue
    resources:
      llm: true
  - agent_name: coder-c
    role: codeur
    occupation: continue
    resources:
      llm: true

  # ── Testeurs : vérifient le code fonctionne ──
  - agent_name: tester-a
    role: test_runner
    occupation: continue
    resources:
      llm: true
  - agent_name: tester-b
    role: test_runner
    occupation: continue
    resources:
      llm: true

  # ── Reviewer : relit le code (optionnel, anti-affinité modèle) ──
  - agent_name: reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true

  # ── Merger : intègre les branches une fois les tâches terminées ──
  - agent_name: integrator
    role: orchestrateur
    occupation: continue
    resources:
      llm: true

resources:
  budget_per_hour: 100
  max_concurrent: 8
  llm_quota_per_day: 500

# ── Task_supervisor : tableau de règles (in_type, in_tag) → (out_type, out_tag) ──
# OBLIGATOIRE (V0.15 taskflow). Le supervisor applique ces règles mécaniquement
# (sans LLM) : quand une sub_task est done/cancelled avec un tag, il crée la
# sub_task de sortie (avec dépendance) et passe le groupe complet en supervised.
# out_type vide = pas de création (le noeud est terminal → supervised).
supervisor_rules:
  - {in_type: planning, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: coding, in_tag: done/ok, out_type: reviewing, out_tag: ""}
  - {in_type: coding, in_tag: done/failure, out_type: planning, out_tag: ""}
  - {in_type: coding, in_tag: done/need_split, out_type: planning, out_tag: ""}
  - {in_type: reviewing, in_tag: ok, out_type: testing, out_tag: ""}
  - {in_type: reviewing, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: testing, in_tag: ok, out_type: merging, out_tag: ""}
  - {in_type: testing, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: merging, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: merging, in_tag: conflict, out_type: coding, out_tag: ""}
