name: swarm-selfimprove
version: 0.1.0
description: "Swarm autonome d'amélioration de ModelWeaver — cycle analyser → planifier → coder (parallèle) → tester (parallèle) → valider → déployer si OK"
workspace_id: mw-swarm
topology: hierarchical

director:
  agent_name: swarm-orchestrator
  role: orchestrateur
  occupation: continue
  workflow: orchestrate
  resources:
    llm: true
  # Auto-allocation LLM (pas de provider/model figé) : l'Organisateur choisit.

members:
  # ── Analyse : lit le code, identifie une amélioration ──
  - agent_name: analyst
    role: architecte
    occupation: noncontinue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["dev"]
              context: "Analyste du swarm. Clone le projet (git_clone project_id=mw-swarm), lit le code demandé, identifie une amélioration concrète. Réponds avec l'analyse et l'amélioration proposée."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── Plan : décompose en tâches ordonnancées ──
  - agent_name: planner
    role: planificateur
    occupation: noncontinue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["dev"]
              context: "Planificateur du swarm. À partir de l'analyse, décompose en tâches ordonnancées concrètes (fichiers à modifier, tests à écrire). Liste les tâches."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── Code : écrit/modifie le code dans son clone (3 codeurs parallèles) ──
  - agent_name: coder-a
    role: codeur
    occupation: noncontinue
    resources:
      llm: true
    config: &coder_cfg
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["dev"]
              context: "Codeur du swarm. Clone le projet (git_clone project_id=mw-swarm), applique les modifications demandées sur les fichiers, vérifie la syntaxe (check_syntax), puis commit et push (git_lite commit + push)."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS
  - agent_name: coder-b
    role: codeur
    occupation: noncontinue
    resources:
      llm: true
    config: *coder_cfg
  - agent_name: coder-c
    role: codeur
    occupation: noncontinue
    resources:
      llm: true
    config: *coder_cfg

  # ── Test : exécute les batteries dans un conteneur Docker persistant
  #    (bundle `test` = docker/run@v1 + pytest). 2 testeurs parallèles. ──
  - agent_name: tester-a
    role: test_runner
    occupation: noncontinue
    resources:
      llm: true
    config: &tester_cfg
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["test"]
              context: "Testeur du swarm. NE TESTE PAS tout le projet : identifie d'abord ce qui a été codé/modifié (git_diff_v1 / git_log_v1 pour voir les changements récents des codeurs), puis CRÉE un test ciblé qui vérifie ce fonctionnement précis (write_file_v1 ou test_runner_v1), et EXÉCUTE ce test seulement (docker/run_v1 avec une commande ciblée sur les fichiers modifiés, PAS pytest sur tout le repo). Réponds STATUS: PASSED ou STATUS: FAILED avec la sortie du test."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS
  - agent_name: tester-b
    role: test_runner
    occupation: noncontinue
    resources:
      llm: true
    config: *tester_cfg

  # ── Review : relit, bloque si problème ──
  - agent_name: reviewer
    role: relecteur
    occupation: noncontinue
    resources:
      llm: false
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["dev"]
              context: "Relecteur du swarm. Clone le projet, relit les changements (git diff), identifie les problèmes. Réponds REVIEW: OK ou REVIEW: issues trouvées."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── Intégration : merge, résout les conflits, pousse si tests OK ──
  - agent_name: integrator
    role: orchestrateur
    occupation: noncontinue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["dev", "test"]
              context: "Intégrateur du swarm. Vérifie que les tests passent (docker/run@v1), résout les conflits, merge et push si tout est OK. Réponds INTEGRATION: OK (déployé) ou INTEGRATION: bloqué."
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

resources:
  budget_per_hour: 100
  max_concurrent: 5
  llm_quota_per_day: 500
