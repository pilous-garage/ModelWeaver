name: dev-chat
version: 0.1.0
description: "Chat de développement piloté par un agent maître (chat-pilot) à 2 modes (plan/build). Le pilote lit le code, écrit un plan.md dans son home, décompose en tâches workspace (explore_task, coding_task, test_task, review_task), les membres gloutons les piochent (greedy), et le pilote vérifie la complétion via task_get/task_list. Délégation = tâches workspace, PAS call_agent. Tous les membres RÉFÉRENCENT le catalogue d'agents (field ref) — la team est une composition d'agents, elle ne les définit pas."
workspace_id: mw-dev-chat
topology: flat

members:
  # ── AGENT MAÎTRE : chat de dev, modes plan/build (gérés par le prompt + FSM) ──
  - agent_name: chat-pilot
    ref: chat-pilot
    role: architecte
    occupation: noncontinue
    resources:
      llm: true

  # ── EXPLORE : pioche les explore_task (lecture seule) ──
  - agent_name: explore
    ref: greedy-explore
    role: explore
    occupation: continue
    resources:
      llm: true

  # ── CODEURS : piochent les coding_task (junior/senior) ──
  - agent_name: coder-a
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true
  - agent_name: coder-b
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true
  - agent_name: coder-c
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true
  - agent_name: coder-d
    ref: greedy-coder
    role: codeur
    occupation: continue
    resources:
      llm: true

  # ── TESTEUR : pioche les test_task ──
  - agent_name: tester
    ref: greedy-tester
    role: test_runner
    occupation: continue
    resources:
      llm: true

  # ── REVIEWER : pioche les review_task ──
  - agent_name: reviewer
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
  # Reviewers additionnels (backlog de review important) : même agent catalogue.
  - agent_name: reviewer-2
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
  - agent_name: reviewer-3
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
  - agent_name: reviewer-4
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
  - agent_name: reviewer-5
    ref: greedy-reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true

  # ── ANALYST : analyse les missions (avis indépendants, découpe des tâches) ──
  - agent_name: analyst
    ref: greedy-analyst
    role: architecte
    occupation: continue
    resources:
      llm: true

  # ── MERGER : regroupe les livrables des membres dans le home ──
  - agent_name: merger
    ref: greedy-merger
    role: orchestrateur
    occupation: continue
    resources:
      llm: true

resources:
  budget_per_hour: 100
  max_concurrent: 9
  llm_quota_per_day: 800

# ── Task_supervisor : tableau de règles (in_type, in_tag) → (out_type, out_tag) ──
# OBLIGATOIRE (V0.15 taskflow). Le supervisor applique ces règles mécaniquement
# (sans LLM) : quand une sub_task est done/cancelled avec un tag, il crée la
# sub_task de sortie (avec dépendance) et passe le groupe complet en supervised.
# out_type vide = pas de création (le noeud est terminal → supervised).
supervisor_rules:
  - {in_type: analysis, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: coding, in_tag: done/ok, out_type: review, out_tag: ""}
  - {in_type: coding, in_tag: done/failure, out_type: analysis, out_tag: ""}
  - {in_type: coding, in_tag: done/need_split, out_type: analysis, out_tag: ""}
  - {in_type: review, in_tag: ok, out_type: testing, out_tag: ""}
  - {in_type: review, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: testing, in_tag: ok, out_type: merge, out_tag: ""}
  - {in_type: testing, in_tag: fail, out_type: coding, out_tag: ""}
  - {in_type: merge, in_tag: ok, out_type: "", out_tag: ""}
  - {in_type: merge, in_tag: conflict, out_type: coding, out_tag: ""}
