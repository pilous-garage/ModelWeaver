name: dev-chat
version: 0.1.0
description: "Chat de développement piloté par un agent maître (chat-pilot) à 2 modes (plan/build). Le pilote lit le code, écrit un plan.md dans son home, décompose en tâches workspace (explore_task, coding_task, test_task, review_task), les membres gloutons les piochent (greedy), et le pilote vérifie la complétion via task_get/task_list. Délégation = tâches workspace, PAS call_agent."
workspace_id: mw-dev-chat
topology: flat

members:
  # ── AGENT MAÎTRE : chat de dev, modes plan/build (gérés par le prompt + FSM) ──
  # Variable mode : "plan" (lecture seule + écrit plan.md + crée des tâches) ou
  # "build" (exécute les tâches, vérifie, itère). Le home de l'agent contient
  # plan.md qu'il écrit puis relit.
  - agent_name: chat-pilot
    role: architecte
    occupation: noncontinue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: set_variable
            name: mode
            value: "{{request.mode}}"
            next: plan_or_build
          - id: plan_or_build
            type: switch
            variable: "{{mode}}"
            conditions:
              - operator: EQUALS
                value: "plan"
                next: run_plan
              - operator: EQUALS
                value: "build"
                next: run_build
            default: run_plan
          - id: run_plan
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["manager", "dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es le pilote du chat de développement (mode PLAN). READ-ONLY.
                Consigne de sécurité : tu ne PEUX PAS modifier le code du projet.
                Tu peux LIRE le code (file/read_file@v1, shell/exec@v1 en lecture :
                ls/cat/grep/glob), poser des questions à l'utilisateur
                (agent/ask_user@v1), et écrire UNIQUEMENT ton plan dans
                {{home}}/plan.md (file/write_file@v1).

                Déroulé :
                1. Comprends la demande utilisateur en explorant le code
                   (fichiers concernés, routes, patterns).
                2. Si ambigu : pose des questions (agent/ask_user@v1).
                3. Écris plan.md dans ton home ({{home}}/plan.md) : objectif,
                   fichiers à modifier, tâches à déléguer (explore_task pour
                   exploration, coding_task pour le code, test_task pour les
                   tests, review_task pour la relecture).
                4. Découpe le plan en TÂCHES workspace avec
                   workspace/task_create@v1 (workspace {{workspace_id}},
                   role_required : explore|coder_junior|coder_senior|tester|
                   reviewer).
                5. Réponds avec un résumé du plan + la liste des tâches créées.
                Le mode build (exécution) sera activé quand l'utilisateur
                approuvera le plan.
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: run_build
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "{{request}}"
              bundles: ["manager", "dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es le pilote du chat de développement (mode BUILD).
                Le plan est approuvé. Tu ORCHESTRES l'exécution via les tâches
                du workspace {{workspace_id}} (les membres gloutons les
                exécutent) :
                1. Crée/lance les tâches restantes (workspace/task_create@v1)
                   avec role_required adapté (coder_junior/senior, tester,
                   reviewer).
                2. Surveille l'avancement : workspace/task_list@v1 +
                   workspace/task_get@v1 (status pending/running/done).
                3. Vérifie la COMPLÉTION : une tâche doit être done avec
                   résultat/commit ; sinon relance une tâche corrective.
                4. Lis ton plan.md ({{home}}/plan.md) si besoin pour suivre.
                5. Quand tout est done, fais une synthèse et réponds.
                Utilise workspace/chat_post@v1 pour communiquer avec les
                membres si nécessaire.
              max_loops: 150
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── EXPLORE : pioche les explore_task (lecture seule) ──
  - agent_name: explore
    role: explore
    occupation: continue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "Surveille le workspace {{workspace_id}} et exécute les tâches d'exploration (role explore)"
              bundles: ["dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es l'explorateur du chat de dev. READ-ONLY : tu ne modifies
                JAMAIS le code. Boucle gloutonne :
                1. Pioche une tâche role_required=explore avec
                   workspace/task_claim_next@v1 (workspace {{workspace_id}}).
                2. Explore le code demandé (file/read_file@v1, shell/exec@v1 :
                   ls/cat/grep/glob).
                3. Marque la tâche done avec workspace/task_done@v1 (résultat =
                   ton analyse).
                4. Reprends à l'étape 1.
                Réponds avec ton analyse des fichiers explorés.
              max_loops: 80
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── CODEURS : piochent les coding_task (junior/senior) ──
  - agent_name: coder-a
    role: codeur
    occupation: continue
    resources:
      llm: true
    config: &coder_cfg
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "Surveille le workspace {{workspace_id}} et exécute les tâches de code"
              bundles: ["dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es un codeur du chat de dev. Boucle gloutonne :
                1. Pioche une tâche role_required=coder_junior OU coder_senior
                   avec workspace/task_claim_next@v1.
                2. Lis le plan/les fichiers, implémente la modification
                   (file/read_file@v1, file/write_file@v1, shell/exec@v1,
                   git/lite@v1).
                3. Commit le travail (git), marque la tâche done avec
                   workspace/task_done@v1 (commit_hash).
                4. Reprends à l'étape 1.
                Réponds avec le résumé de ce qui a été fait + le commit.
              max_loops: 100
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS
  - agent_name: coder-b
    role: codeur
    occupation: continue
    resources:
      llm: true
    config: *coder_cfg

  # ── TESTEUR : pioche les test_task ──
  - agent_name: tester
    role: test_runner
    occupation: continue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "Surveille le workspace {{workspace_id}} et exécute les tâches de test"
              bundles: ["test", "dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es le testeur du chat de dev. Boucle gloutonne :
                1. Pioche une tâche role_required=tester avec
                   workspace/task_claim_next@v1.
                2. Identifie les changements (git diff), exécute les tests /
                   typecheck (shell/exec@v1).
                3. Marque la tâche done avec workspace/task_done@v1
                   (STATUS: PASSED ou FAILED + sortie).
                4. Reprends à l'étape 1.
                Réponds avec le résultat des tests.
              max_loops: 80
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

  # ── REVIEWER : pioche les review_task ──
  - agent_name: reviewer
    role: relecteur
    occupation: continue
    resources:
      llm: true
    config:
      workflow:
        steps:
          - id: start
            type: call
            fn: workflow/autonomous@v1
            inputs:
              request: "Surveille le workspace {{workspace_id}} et exécute les tâches de relecture"
              bundles: ["dev"]
              workspace_id: "{{workspace_id}}"
              context: |
                Tu es le relecteur du chat de dev. Boucle gloutonne :
                1. Pioche une tâche role_required=reviewer avec
                   workspace/task_claim_next@v1.
                2. Relis les changements (git diff, file/read_file@v1).
                3. Marque la tâche done avec workspace/task_done@v1
                   (REVIEW: OK ou REVIEW: issues + liste).
                4. Reprends à l'étape 1.
                Réponds avec ta relecture.
              max_loops: 80
            capture:
              stdout: result
            next: end
          - id: end
            type: end
            status: SUCCESS

resources:
  budget_per_hour: 100
  max_concurrent: 6
  llm_quota_per_day: 500
