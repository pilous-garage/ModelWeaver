[package]
name = "modelweaver-v2"
version = "0.9.0"
description = "ModelWeaver GUI v2"
authors = ["ModelWeaver Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.6.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
