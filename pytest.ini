[pytest]
# Par défaut : on NE lance PAS les benchmarks ni les stress tests (markers
# bench / stress / stress30). Ils s'exécutent EXPLICITEMENT via -m :
#   python3 -m pytest tests/auto_test_check_official/bench/ -m bench -q -s
#   python3 -m pytest tests/auto_test_check_official/ -m stress -q -s
addopts = -m "not bench and not stress and not stress30"
markers =
    bench: benchmarks FSM (mesure de capacité/ressources, PAS exécutés par défaut)
    stress: stress tests (charge lourde, PAS exécutés par défaut)
    stress30: stress groupé ~30 min (PAS exécutés par défaut)
