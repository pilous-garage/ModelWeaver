name: manager
description: "Orchestration, workspace, agents, workflow et communication inter-agents."
permissions:
  - tool: "workspace_*"
    action: allow
  - tool: "system_log_v1"
    action: allow
  - tool: "system_home_read_v1"
    action: allow
  - tool: "system_home_ls_v1"
    action: allow
  - tool: "delegate"
    action: allow
  - tool: "*"
    action: deny
skills:
  - workspace/create@v1
  - workspace/task_create@v1
  - workspace/task_list@v1
  - workspace/task_get@v1
  - workspace/task_claim@v1
  - workspace/task_claim_next@v1
  - workspace/task_done@v1
  - workspace/task_file_add@v1
  - workspace/chat_post@v1
  - workspace/chat_recent@v1
  - team/team_members@v1
  - team/agent_status@v1
  - team/agent_log@v1
  - team/process_list@v1
  - system/log@v1
  - system/home/read@v1
  - system/home/ls@v1
