name: system/home/copy@v1
category: system
description: Copie un fichier ou dossier dans le home de l'agent (borné par la racine home).
inputs:
  src:
    type: string
    required: true
    description: Chemin source relatif au home
  dst:
    type: string
    required: true
    description: Chemin destination relatif au home
outputs:
  ok:
    type: boolean
  dst:
    type: string
implementation:
  type: python
  function: file.ops.copy_file