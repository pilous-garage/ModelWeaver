name: git/git_push_remote@v1
category: git
description: Pousse le REPO CENTRAL LOCAL (bare) vers le remote distant (origin,
  ex. github) sur une branche dédiée. Utilisé par l'intégrateur en fin de swarm
  pour pousser le travail des workers sur auto_code_<team_id>. Ne touche jamais
  la branche principale.
inputs:
  project_id:
    type: string
    required: true
    description: Identifiant du projet (repo central local du même nom)
  branch:
    type: string
    required: true
    description: Branche cible sur le distant (ex. auto_code_<team_id>)
  agent_id:
    type: string
    required: false
    description: Identifiant de l'agent (injecté automatiquement par le FSM)
outputs:
  stdout:
    type: string
  stderr:
    type: string
  exit_code:
    type: integer
  ok:
    type: boolean
    description: True ssi le push a réussi
implementation:
  type: python
  function: git.git_push_remote
