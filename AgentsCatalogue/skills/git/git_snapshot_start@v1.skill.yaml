name: git/git_snapshot_start@v1
category: git
description: >
  POSE le commit de départ d'une tâche (commit_start) = HEAD du clone au moment
  du pick (MÉCANIQUE, pas de LLM). En cas de split A→B,C, chaque sous-tâche
  partage le même commit_start (point de départ commun) ; seule la branche/le
  merge diffère ensuite. Si commit_start est déjà posé, ne change rien.
inputs:
  project_id:
    type: string
    required: true
    description: Identifiant du projet (repo central)
  agent_id:
    type: string
    required: false
    description: Agent propriétaire du clone
  workspace_id:
    type: string
    required: false
    description: Workspace de la tâche (pour poser commit_start)
  task_id:
    type: integer
    required: false
    description: Tâche dont on pose commit_start
outputs:
  ok:
    type: boolean
  commit_start:
    type: string
  branch:
    type: string
  error:
    type: string
implementation:
  type: python
  function: git.git_snapshot_start
