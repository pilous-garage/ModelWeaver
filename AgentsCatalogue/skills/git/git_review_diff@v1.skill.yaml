name: git/git_review_diff@v1
category: git
description: >
  Récupère le DIFF d'une plage de commits d'une tâche (MÉCANIQUE, pas de LLM) :
  `git diff <commit_start>..<commit_current>` + la liste des fichiers modifiés.
  Utilisé par le reviewer pour examiner le livrable SANS outils git LLM.
  Si commit_start est vide, diff vs le parent du commit livré.
inputs:
  project_id:
    type: string
    required: true
    description: Identifiant du projet (repo central)
  agent_id:
    type: string
    required: false
    description: Agent propriétaire du clone
  commit_start:
    type: string
    required: false
    default: ""
    description: Commit de départ (point commun du split) ; vide = parent du livré
  commit_end:
    type: string
    required: false
    default: ""
    description: Commit livré (commit_current/commit_hash) ; vide = HEAD
outputs:
  ok:
    type: boolean
  diff:
    type: string
    description: Diff complet de la plage (stdout git diff)
  files:
    type: array
    description: Fichiers modifiés (ajoutés/modifiés/supprimés)
  stat:
    type: string
    description: Résumé --stat de la plage
  error:
    type: string
implementation:
  type: python
  function: git.git_review_diff
