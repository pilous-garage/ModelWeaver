name: comm/ask_authorisation@v1
category: comm
description: |
  Demande une autorisation (path read/write ou commande whitelistée). Par
  défaut la demande va au LEADER de la team (approver_level=leader) qui peut
  l'autoriser (si de sa juridiction), la refuser, demander pourquoi, ou la
  transmettre à un humain (to=human). L'agent continue SANS attendre.

  action :
    - path_read  : autoriser la LECTURE d'un chemin (path)
    - path_write : autoriser l'ÉCRITURE sur un chemin (path)
    - command    : autoriser une commande shell (command)
  scope (portée de l'autorisation demandée) :
    - once    : une seule exécution (défaut)
    - run     : pour le run courant de l'agent
    - day     : jusqu'à la fin de la journée
    - forever : toujours
  to : leader (défaut) | human
inputs:
  action:
    type: string
    required: true
    description: path_read | path_write | command
  path:
    type: string
    required: false
    description: Chemin concerné (pour path_read / path_write)
  command:
    type: string
    required: false
    description: Commande concernée (pour command)
  reason:
    type: string
    required: false
    description: Justification de la demande
  scope:
    type: string
    required: false
    default: once
    description: once | run | day | forever
  to:
    type: string
    required: false
    default: leader
    description: leader (défaut) | human
outputs:
  ok:
    type: boolean
  request_id:
    type: string
    description: Identifiant de la demande d'autorisation
  action:
    type: string
  status:
    type: string
    description: pending
  approver_level:
    type: string
    description: leader | human
  continue_anyway:
    type: boolean
    description: true — l'agent continue sans attendre
implementation:
  type: python
  function: agent.ops.ask_authorisation
