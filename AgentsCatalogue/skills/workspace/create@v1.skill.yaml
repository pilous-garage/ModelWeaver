name: workspace/create@v1
category: workspace
description: Crée un nouveau workspace (projet) avec dépôt git partagé et clone pour le director.
inputs:
  workspace_id:
    type: string
    required: true
    description: Identifiant unique du workspace
  name:
    type: string
    required: true
    description: Nom du projet
  description:
    type: string
    required: false
    default: ''
  director:
    type: string
    required: false
    description: "team_name (team:XXX) ou agent_id (héritage) — le workspace est lié à une position, pas à un agent"
outputs:
  ok:
    type: boolean
  workspace_id:
    type: string
  git_shared:
    type: string
implementation:
  type: python
  function: workspacedb.project.create
