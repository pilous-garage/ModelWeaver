name: workspace/decoupe@v1
category: workspace
description: >
  DÉCOUPE en UNE passe (tool UNIQUE de l'analyste). Deux cas :
  - sous_taches non vide : découpe A → B,C… avec le TYPE de chaque élément
    (niveau de nécessité : analysis|coding|testing|review…) ; le skill génère
    AUTOMATIQUEMENT le merge(B,C,…) (jamais déclaré). L'analysis courante passe
    en waiting_dependencies du merge (re-analysis post-merge).
  - sous_taches vide (rien à découper) : assigne simplement la difficulté et
    clôt l'analyse (done/ok).
  `analyse` (rapport, toujours produit) est enregistré dans task_reports.
inputs:
  workspace_id:
    type: string
    required: true
  task_id:
    type: integer
    required: true
    description: "La tâche (sujet) dont on découpe la sub_task analysis courante"
  sous_taches:
    type: list
    required: false
    default: []
    description: >
      [{title, description, type, difficulty|niveau}] — type = niveau de
      nécessité (analysis|coding|testing|review…). Vide = tâche simple
      (assignation de difficulté, pas de découpe).
  difficulty:
    type: string
    required: false
    default: ""
    description: "Pour le cas simple (sous_taches vide) : easy|medium|hard|expert"
  analyse:
    type: string
    required: false
    default: ""
    description: "Analysis-report de la tâche analysée (toujours produit)"
outputs:
  ok:
    type: boolean
  mode:
    type: string
    description: "decoupe | assign_difficulte"
  created:
    type: list
    description: "sub_task_id des sous-tâches créées"
  merge_sub_task_id:
    type: integer
  analysis_sub_task_id:
    type: integer
implementation:
  type: python
  function: workspacedb.taskflow.decoupe
