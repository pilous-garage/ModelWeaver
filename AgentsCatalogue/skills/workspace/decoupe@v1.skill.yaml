name: workspace/decoupe@v1
category: workspace
description: >
  DÉCOUPE en UNE passe (tool UNIQUE de l'analyste). L'analyste ne connaît PAS
  les vrais task_id : il référence sa tâche courante par l'INDEX 0 et crée des
  tâches 1…n (par type), avec `task_content` et des `dependencies` RELATIVES.
  Le skill résout les index et génère les merges : dépendance unique → lien
  direct ; dépendances multiples → merge intermédiaire (start C après fusion
  des parents) ; merge FINAL (toutes les sous-tâches) → reprise de l'analyse.
  Cas simple (types vide) : assigne `difficulty` et clôt (done/ok).
  `analyse` (rapport) est toujours enregistré.
inputs:
  workspace_id:
    type: string
    required: true
  task_id:
    type: integer
    required: true
    description: "Vrai task_id (injecté par le FSM) — l'analyste ne le connaît pas"
  sub_task_id:
    type: integer
    required: false
    description: "La sub_task analysis courante (index 0)"
  types:
    type: list
    required: false
    default: []
    description: >
      [{type, tasks: [{task_id: 1, task_content, dependencies: [index]}]}].
      task_id = index relatif (1+) ; dependencies = index relatifs (0 = la
      tâche courante). Vide = tâche simple (assignation de difficulté).
  difficulty:
    type: string
    required: false
    default: ""
    description: "Cas simple : easy|medium|hard|expert"
  analyse:
    type: string
    required: false
    default: ""
    description: "Analysis-report (toujours produit)"
outputs:
  ok:
    type: boolean
  mode:
    type: string
    description: "decoupe | assign_difficulte"
  created:
    type: list
  merge_sub_task_id:
    type: integer
  analysis_sub_task_id:
    type: integer
implementation:
  type: python
  function: workspacedb.taskflow.decoupe
