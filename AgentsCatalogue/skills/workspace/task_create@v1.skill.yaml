name: workspace/task_create@v1
category: workspace
description: Crée une tâche dans un workspace.
inputs:
  workspace_id:
    type: string
    required: true
  title:
    type: string
    required: true
  description:
    type: string
    required: false
    default: ''
  priority:
    type: integer
    required: false
    default: 0
  parent_id:
    type: integer
    required: false
  difficulty:
    type: string
    required: false
    default: medium
    description: "easy / medium / hard / expert"
  role_required:
    type: string
    required: false
    default: ""
    description: "coder_senior / coder_mid / coder_junior / tester / reviewer / merger"
outputs:
  ok:
    type: boolean
  task:
    type: object
implementation:
  type: python
  function: workspacedb.task.create
