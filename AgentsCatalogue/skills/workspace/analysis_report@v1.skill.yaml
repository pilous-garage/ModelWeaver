name: workspace/analysis_report@v1
category: workspace
description: >
  ATTACHE le rapport d'analyse à la tâche analysée (task_reports, role
  analysis). L'analyste produit TOUJOURS un analysis-report (plus ou moins
  gros) dont le nom reprend la tâche analysée — simplifie l'analyse post-merge.
inputs:
  workspace_id:
    type: string
    required: true
  task_id:
    type: integer
    required: true
  content:
    type: string
    required: true
outputs:
  ok:
    type: boolean
  task_id:
    type: integer
implementation:
  type: python
  function: workspacedb.taskflow.analysis_report
