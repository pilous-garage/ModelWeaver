name: workspace/entry_create@v1
category: workspace
description: >
  ENTRYPOINT du swarm (as_llm_leader, SANS LLM) : crée la TASK d'entrée selon
  le type demandé (chat_entry, completion_entry…) + sa sub_task `planning`
  initiale unattributed. Le supervisor/l'analyste prennent ensuite le relais.
  PREMIÈRE ÉTAPE : si entry_type absent, la requête est classifiée (prompt
  épurée → consensus) en simple/texte/code → route chat_entry/completion_entry/
  feature.
inputs:
  workspace_id:
    type: string
    required: true
  title:
    type: string
    required: true
  description:
    type: string
    required: false
  entry_type:
    type: string
    required: false
    default: ""
    description: "chat_entry | completion_entry | feature… (vide = auto-classifié)"
  classify_consensus:
    type: boolean
    required: false
    default: true
    description: "Classification via consensus (défaut true)."
  n_answering:
    type: integer
    required: false
    default: 5
    description: "Nb d'answering_machine pour la classification."
  priority:
    type: integer
    required: false
  team_id:
    type: integer
    required: false
outputs:
  ok:
    type: boolean
  task_id:
    type: integer
  sub_task_id:
    type: integer
implementation:
  type: python
  function: workspacedb.taskflow.create_entry
