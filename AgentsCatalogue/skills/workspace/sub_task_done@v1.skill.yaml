name: workspace/sub_task_done@v1
category: workspace
description: >
  MARQUE une sub_task done + TAG (posé par l'agent d'exécution, contraint par
  type : coding→done/ok|done/failure|done/need_split ; testing→ok|fail|no_test ;
  reviewing→ok|fail ; merging→ok|conflict ; planning→ok|failure|need_split). La garde
  livrable (branch/commit_hash) reste pour coding/reviewing/merging (sauf delivered).
inputs:
  workspace_id:
    type: string
    required: true
  sub_task_id:
    type: integer
    required: true
  tag:
    type: string
    required: false
    default: ""
    description: "Résultat qualifié, contraint par le type de sub_task"
  branch:
    type: string
    required: false
  commit_hash:
    type: string
    required: false
  delivered:
    type: boolean
    required: false
    description: "Livrable non-code (rapport, no_test, etc.)"
outputs:
  ok:
    type: boolean
  sub_task:
    type: object
implementation:
  type: python
  function: workspacedb.taskflow.sub_task_done
