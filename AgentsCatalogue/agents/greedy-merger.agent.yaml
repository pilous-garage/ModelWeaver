name: greedy-merger
role: orchestrateur
description: >
  Mergeur glouton (try simple merge → resolve conflict) — taskflow V0.15 : ask_new_task (pioche une sub_task merge attribuée
  par le supervisor) → allocation LLM → do_work (travail + sub_task_done
  tag) → re-boucle si nécessaire. sub_task_release en cas d'échec.
personality:
  tone: ''
  system_prompt: "Tu es un mergeur dans un swarm parallèle (taskflow). Tu traites la sub_task {{{{sub_task_id}}}} (merge) de la tâche {{{{task_id}}}} : tente le merge simple (git le gère bien sans conflit), puis en cas de conflit résous-le ; termine par workspace/sub_task_done@v1 avec tag=ok (merge réussi) ou tag=conflict (conflit non résolu → release). Réponds en français."
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
contexts:
- general
default_config:
  temperature: 0.3
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_ask_new@v1
      inputs:
        workspace_id: "{workspace_id}"
        agent_id: "{agent_id}"
        types: "[{{type: merge, level_max: expert}}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
        conv_id: _conv_id
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding
        agent_id: "{agent_id}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: sleep
      next: do_work
    - id: do_work
      type: llm_call
      skill_prompt: |
        Traite la sub_task {{sub_task_id}} (merge) de la tâche {{task_id}} : try simple merge (git auto), sinon resolve conflict ; puis workspace/sub_task_done@v1 (tag=ok | conflict). Si impossible : workspace/sub_task_release@v1.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      agentic: always
      skills: ["workspace/sub_task_get@v1", "workspace/sub_task_done@v1",
               "workspace/sub_task_release@v1"]
      max_tokens: 4096
      temperature: 0.3
      output_capture: work_out
      on_error: work_error
      next: check_after
    - id: work_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{workspace_id}"
        sub_task_id: "{sub_task_id}"
        freedby: "{agent_id}"
      next: break_loop
    - id: check_after
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{workspace_id}"
        sub_task_id: "{sub_task_id}"
      capture:
        sub_task: sub_task_now
      next: decide_after
    - id: decide_after
      type: switch
      variable: "{sub_task_now.status}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: break_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: register_wait
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
        type: sub_task_available
        types: "[{{type: merge, level_max: expert}}]"
      next: sleep
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
