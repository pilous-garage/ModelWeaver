name: greedy-coder
role: codeur
description: >
  Codeur glouton — taskflow V0.15 : ask_new_task (pioche une sub_task coding
  attribuée par le supervisor) → git_step (clone/checkout) → allocation LLM →
  working_loop (do_work : code réel + sub_task_done tag=done/ok avec
  branch/commit, ou sub_task_release). La finalisation git est automatique.
personality:
  tone: ''
  system_prompt: "Tu es un codeur dans un swarm parallèle (taskflow). Tu
    implémentes la description de ta sub_task (sub_task_id) dans le clone git
    de ton workspace. Règles :
    1. Lis la description de la sub_task (workspace/sub_task_get@v1) et les
       fichiers du projet.
    2. Écris réellement le code (file_write_file_v1), vérifie la syntaxe.
    3. Quand tu as fini : committe/pousse (git/commit@v1) puis appelle
       workspace/sub_task_done@v1 avec tag=done/ok (branch + commit_hash). Si
       c'est trop difficile : workspace/sub_task_release@v1 (tag=done/failure).
    4. Ne supprime jamais de fichiers existants sans raison.
    Réponds en français, code en anglais."
skills:
  - file/read_file@v1
  - file/write_file@v1
  - file/append_file@v1
  - file/glob@v1
  - file/grep@v1
  - file/list_dir@v1
  - system/check_syntax@v1
  - shell/exec@v1
  - git/commit@v1
  - workspace/sub_task_get@v1
  - workspace/sub_task_done@v1
  - workspace/sub_task_release@v1
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.3
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 60
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_ask_new@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        types: "[{type: coding, level_max: expert}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: sleep
      next: do_work
    - id: do_work
      type: llm_call
      skill_prompt: |
        Code la sub_task {{sub_task_id}} (coding) de la tâche {{task_id}} :
        lis la description (workspace/sub_task_get@v1), écris le code,
        committe/pousse (git/commit@v1), puis termine par
        workspace/sub_task_done@v1 avec tag=done/ok (branch + commit_hash).
        Si impossible : workspace/sub_task_release@v1 (tag=done/failure).
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      skills: ["file/read_file@v1", "file/write_file@v1", "file/append_file@v1",
               "file/glob@v1", "file/grep@v1", "file/list_dir@v1",
               "system/check_syntax@v1", "shell/exec@v1", "git/commit@v1",
               "workspace/sub_task_get@v1", "workspace/sub_task_done@v1",
               "workspace/sub_task_release@v1"]
      max_tokens: 4096
      temperature: 0.3
      output_capture: work_out
      on_error: work_error
      next: check_after
    - id: work_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
        freedby: "{{agent_id}}"
        tag: done/failure
      next: break_loop
    - id: check_after
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: decide_after
    - id: decide_after
      type: switch
      variable: "{{sub_task_now.status}}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: continue_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: continue_loop
      type: continue
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
