name: greedy-coder
role: codeur
description: >
  Codeur glouton — taskflow V0.15 : ask_new_task (pioche une sub_task coding
  attribuée par le supervisor) → git_step (clone/checkout) → allocation LLM →
  working_loop (do_work : code réel + sub_task_done tag=done/ok avec
  branch/commit, ou sub_task_release). La finalisation git est automatique.
personality:
  tone: ''
  system_prompt: "Tu es un codeur dans un swarm parallèle (taskflow). Tu
    implémentes la description de ta sub_task (sub_task_id) dans le clone git
    de ton workspace. Règles :
    1. OBTIENS ta description en APPELANT l'OUTIL workspace_sub_task_get_v1
       (passe sub_task_id) — ce n'est PAS un fichier à lire, c'est un outil.
       Ne fais jamais file_read_file sur 'workspace/sub_task_get@v1'.
    2. Écris réellement le code (file_write_file_v1), vérifie la syntaxe.
    3. Quand tu as fini : committe/pousse (git_git_commit_v1) puis appelle
       workspace_sub_task_done_v1 avec tag=done/ok (branch + commit_hash). Si
       c'est trop difficile : workspace_sub_task_release_v1 (tag=done/failure).
    4. Ne supprime jamais de fichiers existants sans raison.
    5. IMPORTANT : les skills workspace/* (sub_task_get, sub_task_done,
       sub_task_release, ask_intel) sont des OUTILS à appeler via
       ###tool_call:..., pas des fichiers.
    Réponds en français, code en anglais."
skills:
  - file/read_file@v1
  - file/write_file@v1
  - file/append_file@v1
  - file/glob@v1
  - file/grep@v1
  - file/list_dir@v1
  - system/check_syntax@v1
  - shell/exec@v1
  - git/git_clone@v1
  - git/git_checkout@v1
  - git/git_snapshot_start@v1
  - git/git_prepare_workspace@v1
  - git/git_commit@v1
  - git/git_push@v1
  - workflow/reset_variable_after_change_task@v1
  - workspace/sub_task_get@v1
  - workspace/sub_task_done@v1
  - workspace/sub_task_release@v1
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.3
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 60
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        types: "[{type: coding, level_max: expert}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
        workspace_id: workspace_id
        conv_id: _conv_id
        repo: repo
        branch: branch
        commit_start: commit_start
        project_id: project_id
        resumed: resumed
      on_error: sleep
      next: decide_reset
    # reset des variables du cycle UNIQUEMENT si on ne reprend pas une doing
    # (resumed=False). Si on reprend (crash/relaunch), on garde le contexte.
    - id: decide_reset
      type: switch
      variable: "{{resumed}}"
      conditions:
      - operator: NOT_EQUALS
        value: "true"
        next: reset_vars
      default: prepare_workspace
    - id: reset_vars
      type: call
      fn: workflow/reset_variable_after_change_task@v1
      inputs:
        agent_id: "{{agent_id}}"
      next: prepare_workspace
    # prépare le workspace : clone + checkout de la branche + commit_start.
    - id: prepare_workspace
      type: call
      fn: git/prepare_workspace@v1
      inputs:
        project_id: "{{repo}}"
        agent_id: "{{agent_id}}"
        branch: "{{branch}}"
        workspace_id: "{{workspace_id}}"
        task_id: "{{task_id}}"
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: sleep
      next: do_work
    - id: do_work
      type: llm_call
      skill_prompt: |
        Code la sub_task {{sub_task_id}} (coding) de la tâche {{task_id}}.

        TON WORKSPACE : le repo est déjà cloné (project {{repo}}) et tu es sur
        la branche {{branch}}. Écris tes fichiers dans le clone git de ton
        workspace, puis committe et POUSSE (git_git_commit_v1 puis
        git_git_push_v1).

        ÉTAPE 1 — OBTIENS TA DESCRIPTION :
        Appelle l'OUTIL ###tool_call:workspace_sub_task_get_v1|{"sub_task_id":
        {{sub_task_id}}, "workspace_id": "{{workspace_id}}"}### pour lire la
        description. C'est un OUTIL (pas un fichier). Ne fais JAMAIS
        file_read_file sur 'workspace/sub_task_get@v1'.

        ÉTAPE 2 — CODE : écris le fichier (file_write_file_v1), vérifie la
        syntaxe (system_check_syntax_v1).

        ÉTAPE 3 — TERMINE : committe ET POUSSE (git_git_commit_v1 puis
        git_git_push_v1 sur la branche {{branch}}) puis appelle
        ###tool_call:workspace_sub_task_done_v1|{"sub_task_id": {{sub_task_id}},
        "workspace_id": "{{workspace_id}}", "tag": "done/ok", "branch": "...",
        "commit_hash": "..."}###. Si impossible :
        ###tool_call:workspace_sub_task_release_v1|{"sub_task_id":
        {{sub_task_id}}, "workspace_id": "{{workspace_id}}",
        "tag": "done/failure"}###.

        RAPPEL : les skills workspace/* (sub_task_get, sub_task_done,
        sub_task_release, ask_intel) sont des OUTILS à appeler via
        ###tool_call:, PAS des fichiers à lire.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      agentic: always
      base_tools: false
      skills: ["file/read_file@v1", "file/write_file@v1", "file/append_file@v1",
               "file/glob@v1", "file/grep@v1", "file/list_dir@v1",
               "system/check_syntax@v1", "shell/exec@v1",
               "git/git_clone@v1", "git/git_checkout@v1", "git/git_commit@v1",
               "git/git_push@v1",
               "workspace/sub_task_get@v1", "workspace/sub_task_done@v1",
               "workspace/sub_task_release@v1",
               "workspace/ask_intel@v1"]
      max_tokens: 4096
      temperature: 0.3
      output_capture: work_out
      on_error: work_error
      next: check_after
    - id: work_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
        freedby: "{{agent_id}}"
        tag: done/failure
      next: break_loop
    - id: check_after
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: decide_after
    - id: decide_after
      type: switch
      variable: "{{sub_task_now.status}}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: break_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: register_wait
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
        type: sub_task_available
        types: "[{{type: coding, level_max: expert}}]"
      next: sleep
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
