name: greedy-coder
role: codeur
description: "Codeur glouton intelligent — FSM: pick (pioche un token coding via
  token_task_pick) → clone (repo du token) → checkout (branche/commit) →
  allocation LLM (check_llm/ask_llm) → boucle de travail (llm_call, end_exec
  quand fini) → transition du token (coding → code_review). La mécanique
  (pick/clone/checkout/commit/transition) est automatique, le LLM ne fait que
  le travail intellectuel."
personality:
  tone: ''
  system_prompt: "Tu es un codeur dans un swarm parallèle. Tu implémentes la
    description de ton token dans le clone git de ton workspace. Règles :
    1. Lis la description du token et les fichiers du projet.
    2. Écris réellement le code (file_write_file_v1), vérifie la syntaxe.
    3. Quand tu estimes avoir fini, appelle le tool end_exec — TOUTE la
       mécanique (git add, commit, push, transition du token vers code_review)
       est automatique.
    4. Ne supprime jamais de fichiers existants sans raison.
    Réponds en français, code en anglais."
bundles:
  - dev
generates:
  - code_review
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.3
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 60
    steps:
    # ── 1. PICK : pioche un token coding (AUTO, pas de LLM) ──
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: coding, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: resolve_repo

    # ── 1b. RESOLVE_REPO : repo du token, fallback sur project_id ──
    - id: resolve_repo
      type: switch
      variable: "{{task.repo}}"
      conditions:
      - operator: CONTAINS
        value: "{{"
        next: repo_default
      - operator: EQUALS
        value: ""
        next: repo_default
      default: repo_task
    - id: repo_default
      type: set_variable
      name: repo_eff
      value: "{{project_id}}"
      next: clone
    - id: repo_task
      type: set_variable
      name: repo_eff
      value: "{{task.repo}}"
      next: clone

    # ── 2. CLONE : le repo du token (AUTO) ──
    - id: clone
      type: call
      fn: git/git_clone@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
      on_error: fail
      next: checkout

    # ── 3. CHECKOUT : branche/commit du token (AUTO) ──
    - id: checkout
      type: call
      fn: git/git_checkout@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
        name: "{{task.branch}}"
      next: check_llm

    # ── 4. CHECK_LLM : LLM déjà assigné ? (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: exec_loop

    # ── 5. ASK_LLM : allocation (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding_high
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: exec_loop

    # ── 5b. LLM_ERROR : classifier et brancher (AUTO) ──
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep

    # ── 6. EXEC_LOOP : boucle de travail (LE SEUL LLM) ──
    - id: exec_loop
      type: while
      condition:
        variable: task_state
        operator: NOT_EQUALS
        value: "done"
      body:
        steps:
        # Le LLM code ; il appelle end_exec (tool des bundles dev) quand fini.
        - id: do_work
          type: llm_call
          skill_prompt: |
            Token à implémenter :
            {{task.title}}
            {{task.description}}

            Projet : {{repo_eff}} (clone dans ton workspace agents/{{agent_id}}/workspace/{{repo_eff}})
            Branche cible : {{task.branch}}

            Implémente le token. Quand tu as fini (code écrit, syntaxe vérifiée),
            appelle IMMÉDIATEMENT le tool end_exec avec task_id={{task.task_id}},
            workspace_id={{workspace_id}}, project_id={{repo_eff}},
            agent_id={{agent_id}} (la transition vers code_review est auto).
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["dev"]
          max_tokens: 4096
          temperature: 0.3
          output_capture: work_out
          next: check_done
        # Vérifier l'état réel du token (AUTO)
        - id: check_done
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide
        # Le token a transitionné (code_review) → sortir ; sinon → verdict
        - id: decide
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "coding"
            next: break_loop
          default: ask_verdict
        - id: break_loop
          type: set_variable
          name: task_state
          value: "done"
          next: break
        # Verdict du LLM : done | continue | error | to_difficult (tool)
        - id: ask_verdict
          type: llm_call
          skill_prompt: |
            Tu as travaillé sur le token {{task.task_id}} sans pouvoir le
            transitionner (end_exec a refusé). Raison : {{work_out}}

            Décide le verdict en appelant le tool task_verdict avec :
            verdict=done | continue | error | to_difficult
            task_id={{task.task_id}}, workspace_id={{workspace_id}},
            task_type=coding.
            - done : le token est réellement fait (utilise end_exec d'abord).
            - continue : continue à travailler, je relance la boucle.
            - error : impossible, signale l'erreur.
            - to_difficult : trop dur — bump de difficulté automatique (ou
              re-découpe si déjà au plafond).
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["workspace_verdict"]
          max_tokens: 1024
          temperature: 0.2
          output_capture: verdict_out
          next: check_after_verdict
        - id: check_after_verdict
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_verdict
        - id: decide_after_verdict
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "coding"
            next: break_loop
          default: continue_loop
        - id: continue_loop
          type: continue

    # ── 7. FIN : le token a transitionné → terminer ──
    - id: end
      type: end
      status: SUCCESS

    # ── 8. SLEEP : rien à piocher (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 9. FAIL ──
    - id: fail
      type: end
      status: FAILED
