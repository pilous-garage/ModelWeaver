name: greedy-tester
role: test_runner
description: >
  Testeur glouton intelligent — FSM adapté du codeur : pick (token testing_code)
  → resolve_repo → clone/checkout → allocation LLM (check_llm/ask_llm/check_error_type)
  → boucle (do_test avec demande docker via ask_docker si nécessaire, verdict via
  task_verdict) → transition du token (testing_code → done/code_review/corrective).
  La mécanique est automatique ; le LLM ne fait que tester et décider.
personality:
  tone: ''
  system_prompt: >
    Tu es un testeur dans un swarm. Tu valides les changements par des tests.
    Règles :
    1. Lis la description du token, identifie les changements.
    2. Demande un docker adapté via ask_docker (with=[python3,pytest,...],
       without=[gcc,node,...], specs de mémoire/CPU) si nécessaire.
    3. Exécute les tests (shell/exec) dans le docker reçu.
    4. Quand tu estimes avoir fini (tests passés ou échec définitif),
       appelle le verdict task_verdict (done | continue | error | to_difficult).
    5. Si échec de test et que le token doit être corrigé, crée une tâche
       corrective coding et transitionne le token.
    Réponds en français, code en anglais.
bundles:
  - test
  - dev
skills:
  - workspace/task_verdict@v1
  - workspace/ask_docker@v1
  - workspace/task_create@v1
  - workspace/task_get@v1
generates:
  - coding
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 60
    steps:
    # ── 1. PICK (AUTO) ──
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: testing_code, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: resolve_repo

    # ── 1b. RESOLVE_REPO ──
    - id: resolve_repo
      type: switch
      variable: "{{task.repo}}"
      conditions:
      - operator: CONTAINS
        value: "{{"
        next: repo_default
      - operator: EQUALS
        value: ""
        next: repo_default
      default: repo_task
    - id: repo_default
      type: set_variable
      name: repo_eff
      value: "{{project_id}}"
      next: clone
    - id: repo_task
      type: set_variable
      name: repo_eff
      value: "{{task.repo}}"
      next: clone

    # ── 2. CLONE + CHECKOUT (AUTO) ──
    - id: clone
      type: call
      fn: git/git_clone@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
      on_error: fail
      next: checkout
    - id: checkout
      type: call
      fn: git/git_checkout@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
        name: "{{task.branch}}"
      next: ask_llm

    # ── 3. ALLOCATION LLM (AUTO) ──
    # Toujours s'allouer un LLM (ask_llm coding_high → agentic). Pas de
    # check_llm : le provider hérité du spawner peut être non-agentic.
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding_high
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: exec_loop

    # ── 3b. LLM_ERROR → CLASSIFIER (AUTO) ──
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep

    # ── 4. EXEC_LOOP : boucle de test (LE SEUL LLM, sandbox docker) ──
    - id: exec_loop
      type: while
      tags:
      - llm
      - sandbox
      condition:
        variable: task_state
        operator: NOT_EQUALS
        value: "done"
      body:
        steps:
        # Demande un docker adapté si nécessaire
        - id: ask_docker_step
          type: call
          fn: workspace/ask_docker@v1
          inputs:
            specs:
              with: ["python3", "pytest"]
              without: ["gcc", "node"]
              memory_mb: 1024
              cpu_cores: 1
            workspace_id: "{{workspace_id}}"
            agent_id: "{{agent_id}}"
          capture:
            docker_result: docker_result
          on_error: ignore_docker
          next: do_test
        - id: ignore_docker
          type: set_variable
          name: docker_result
          value: ""
          next: do_test
        # Test : exécution et verdict
        - id: do_test
          type: llm_call
          skill_prompt: |
            Tu testes le token {{task.task_id}} (testing_code) dans le projet
            {{repo_eff}} (clone dans ton workspace agents/{{agent_id}}/workspace/{{repo_eff}}).

            Si un docker est disponible (docker_result), utilise-le pour exécuter
            tes tests (shell/exec dans le conteneur). Sinon, exécute directement
            dans le clone (shell/exec).

            Règles :
            1. Lis la description du token et identifie les changements.
            2. Exécute les tests / typecheck (shell/exec).
            3. Quand tu estimes avoir fini (tests passés, échec définitif, ou besoin
               de correction), appelle le tool task_verdict avec verdict=done | continue
               | error | to_difficult et task_id={{task.task_id}}.
            4. Si le token doit être corrigé (tests échouent et un nouveau token
               coding est nécessaire), crée aussi workspace/task_create.
            Docker reçu : {{docker_result}}
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["dev", "test"]
          max_tokens: 4096
          temperature: 0.2
          output_capture: test_out
          next: check_after_test
        # Vérifie l'état réel du token après verdict
        - id: check_after_test
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_test
        - id: decide_after_test
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "testing_code"
            next: break_loop
          default: ask_verdict
        # Verdict explicite si encore en cours
        - id: ask_verdict
          type: llm_call
          skill_prompt: |
            Tu as travaillé sur le token {{task.task_id}} (testing_code) sans
            pouvoir le transitionner. Décide le verdict en appelant le tool
            task_verdict avec verdict=done | continue | error | to_difficult,
            task_id={{task.task_id}}, workspace_id={{workspace_id}},
            task_type=testing_code.
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["workspace_verdict"]
          max_tokens: 1024
          temperature: 0.2
          output_capture: verdict_out
          next: check_after_verdict
        - id: check_after_verdict
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_verdict
        - id: decide_after_verdict
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "testing_code"
            next: break_loop
          default: continue_loop
        - id: break_loop
          type: set_variable
          name: task_state
          value: "done"
          next: break
        - id: break
          type: break
        - id: continue_loop
          type: continue
      next: end

    # ── 5. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 6. SLEEP : rien à tester (AUTO, sleep) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      tags:
      - sleep
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 7. FAIL ──
    - id: fail
      type: end
      status: FAILED
