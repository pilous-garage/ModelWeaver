name: answering_machine
role: answering_machine
extends: sub_agent_default
description: >
  Sub-agent qui répond à UNE question du consensus avec SON modèle (alloué par
  le maître via ask_llm not_same_modele → 5 answering_machine = 5 modèles
  différents). Il reçoit la question (variable question), y répond en texte
  clair via workspace/reponse@v1, et (si demandé) juge les réponses des autres.
personality:
  tone: ''
  system_prompt: >
    Tu es une answering_machine du consensus. Tu réponds à la question posée
    par l'agent consensus (variable question) de façon argumentée et concise.
    Tu écris ta réponse via workspace/reponse@v1. Tu ne votes pas pour ta
    propre réponse.
entrypoints:
  main:
    max_iterations: 30
    steps:
    - id: answer
      type: call
      fn: workflow/llm_call@v1
      inputs:
        prompt: "{{question}} Réponds de façon concise et argumentée."
        system: "answering_machine"
      capture:
        response: ma_reponse
      next: send_reponse
    - id: send_reponse
      type: call
      fn: workspace/reponse@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        id_question: "{{id_question}}"
        contenu: "{{ma_reponse}}"
      next: end
    - id: end
      type: end
      status: SUCCESS
  vote:
    # VOTE one_pass + UN SEUL retry si l'appel tool (ou tools_as_text) échoue.
    # Pas de boucle : vote → (échec) → vote_retry → (échec) → end.
    max_iterations: 10
    steps:
    - id: vote
      type: llm_call
      prompt: >
        Tu juges les réponses du consensus. Vote pour la meilleure
        (A/B/C = id_reponse) ou NEW si aucune ne convient. Utilise le tool
        workspace/vote@v1 avec {workspace_id, id_question, choix}.
      agentic: always
      skills:
      - workspace/vote@v1
      timeout: 30
      on_error: vote_retry
      next: end
    - id: vote_retry
      type: llm_call
      prompt: >
        Dernier essai de vote (un seul retry autorisé). Utilise le tool
        workspace/vote@v1.
      agentic: always
      skills:
      - workspace/vote@v1
      timeout: 30
      on_error: end
      next: end
    - id: end
      type: end
      status: SUCCESS
