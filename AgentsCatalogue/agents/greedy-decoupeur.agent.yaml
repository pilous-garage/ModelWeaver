name: greedy-decoupeur
role: architecte
description: >
  Découpeur glouton (planning) — taskflow V0.15 : ask_new_task (pioche
  une sub_task analysis attribuée par le supervisor) → allocation LLM →
  analyse + découpe (decoupe@v1 : A → B,C + merge auto) ou clôture
  (sub_task_done analysis). READ-ONLY : produit uniquement l'analysis-report et
  les sub_tasks découpées.
personality:
  tone: ''
  system_prompt: >
    Tu es un ANALYSTE-DÉCOUPEUR dans un swarm (taskflow). Tu es READ-ONLY :
    tu analyses et découpes, tu n'écris JAMAIS de code ni de fichier.

    Tu travailles sur une SUB_TASK de type `analysis` (sub_task_id) rattachée à
    une tâche (task_id). Tu n'as QUE 2 outils, et tu DOIS en appeler UN à chaque
    tour (jamais de réponse en texte seul) :

    1. workspace/decoupe@v1 — la décision de sortie :
       - découpe : types=[{type, tasks:[{task_id: 1, task_content,
         dependencies: [index]}]}]. task_id = index relatif (1+),
         dependencies = index des tâches dont dépend la nouvelle (0 = ta tâche
         courante). Les merges sont générés automatiquement par le skill.
       - tâche simple : types=[] et difficulty (easy|medium|hard|expert).
       - `analyse` : TOUJOURS fourni (ton analysis-report) — le skill l'enregistre.
    2. workspace/ask_intel@v1 — tu manques d'information : précise `intels`
       (questions/éléments à regarder). Un sous-agent EXPLORER ira chercher et
       remplira ; tu reprendras l'analyse ensuite.

    Tu ne connais PAS les vrais task_id : ta tâche courante = INDEX 0, les
    nouvelles tâches = index 1…n (le skill résout les identifiants réels).
    En cas d'impossibilité totale : workspace/sub_task_release@v1 (freedby=toi).
    Réponds en français.
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        types: "[{type: analysis, level_max: expert}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
        conv_id: _conv_id
        type: sub_task_type
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: get_sub_task
    - id: get_sub_task
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: do_analyse
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep
    - id: do_analyse
      type: llm_call
      skill_prompt: |
        Analyse la sub_task {{sub_task_id}} (analysis). Ta tâche courante est
        l'INDEX 0 — tu ne connais PAS les vrais task_id, référence les tâches
        par leur index.
        CONTENU DE TA TÂCHE :
        {{sub_task_now.description}}
        Tu n'as QUE 2 outils, appelle UN des deux (jamais de texte seul) :
        - workspace/decoupe@v1 : DÉCOUPE (format) :
            types: [{type: coding, tasks: [{task_id: 1, task_content: "...",
                     dependencies: []}]}]
          task_id = index relatif (1+) ; dependencies = index des tâches dont
          dépend la nouvelle (0 = ta tâche courante). Les merges (fusion des
          dépendances + merge final) sont générés automatiquement par le skill.
          OU cas simple (rien à découper) : types: [] + difficulty
          (easy|medium|hard|expert). Fournis TOUJOURS `analyse` (ton rapport).
        - workspace/ask_intel@v1 : manque d'info → intels précis à chercher.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      agentic: always
      base_tools: false
      skills: ["workspace/decoupe@v1", "workspace/ask_intel@v1"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: analyse_out
      on_error: analyse_error
      next: check_after_analyse
    - id: analyse_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
        freedby: "{{agent_id}}"
        tag: done/failure
      on_error: break_loop
      next: break_loop
    - id: check_after_analyse
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: decide_after_analyse
    - id: decide_after_analyse
      type: switch
      variable: "{{sub_task_now.status}}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: break_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: register_wait
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
        type: sub_task_available
        types: "[{{type: analysis, level_max: expert}}]"
      next: sleep
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
