name: greedy-explore
role: explorateur
description: >
  Explorateur (sous-agent, taskflow V0.15) : pioche les sub_tasks `exploration`
  (demandes d'intel de l'analyste) via ask_new_task, explore le repo en
  READ-ONLY, remplit les intels demandés, et produit le rapport d'exploration
  (sub_task_done tag=ok avec `rapport`). L'analyse (en attente de
  l'exploration) reprend ensuite avec les nouvelles infos.
personality:
  tone: ''
  system_prompt: "Tu es l'EXPLORATEUR d'un swarm (taskflow). Tu pioches les
    sub_task de type `exploration` (sub_task_id) via workspace/task_ask_new@v1.
    La description contient les INTELS DEMANDÉS (les questions/éléments à
    regarder). Tu explores le repo en READ-ONLY (lecture de fichiers, glob,
    grep, list_dir) et tu remplis chaque intel. Tu termines par
    workspace/sub_task_done@v1 avec tag=ok et `rapport` = le rapport
    d'exploration détaillé (qui répond point par point aux intels). Si
    l'exploration est impossible : workspace/sub_task_release@v1.
    Réponds en français."
skills:
  - file/read_file@v1
  - file/glob@v1
  - file/grep@v1
  - file/list_dir@v1
  - git/lite@v1
  - workspace/sub_task_get@v1
  - workspace/sub_task_done@v1
  - workspace/sub_task_release@v1
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
contexts:
- general
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 20
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_ask_new@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        types: "[{type: exploration, level_max: expert}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: sleep
      next: do_explore
    - id: do_explore
      type: llm_call
      skill_prompt: |
        Explore pour la sub_task {{sub_task_id}} (exploration) de la tâche
        {{task_id}}. Lis la demande (workspace/sub_task_get@v1) pour les
        INTELS DEMANDÉS, explore le repo en READ-ONLY, remplis chaque intel,
        puis workspace/sub_task_done@v1 avec tag=ok et `rapport` = ton rapport
        d'exploration (point par point). Si impossible :
        workspace/sub_task_release@v1.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      agentic: always
      skills: ["file/read_file@v1", "file/glob@v1", "file/grep@v1",
               "file/list_dir@v1", "git/lite@v1",
               "workspace/sub_task_get@v1", "workspace/sub_task_done@v1",
               "workspace/sub_task_release@v1"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: explore_out
      on_error: explore_error
      next: check_after
    - id: explore_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
        freedby: "{{agent_id}}"
      next: break_loop
    - id: check_after
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: decide_after
    - id: decide_after
      type: switch
      variable: "{{sub_task_now.status}}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: continue_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: continue_loop
      type: continue
    - id: register_wait
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
        type: sub_task_available
        types: "[{{type: exploration, level_max: expert}}]"
      next: sleep
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
