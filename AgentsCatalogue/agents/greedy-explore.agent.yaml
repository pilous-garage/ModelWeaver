name: greedy-explore
role: explore
description: "Explorateur glouton intelligent — FSM: pick (pioche une tâche
  explore) → allocation LLM → exploration (llm_call, read-only) → task_done
  (livrable = analyse). Ne modifie jamais le code."
personality:
  tone: ''
  system_prompt: "Tu es un explorateur de code dans un swarm. READ-ONLY : tu ne
    modifies JAMAIS le code. Tu pioches une tâche d'exploration, lis le code
    demandé, produis ton analyse. Réponds en français."
bundles:
  - dev
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
contexts:
- general
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    # ── 1. PICK : pioche une tâche explore (AUTO) ──
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "{{role_required}}"
      capture:
        task: task
      on_error: sleep
      next: check_llm

    # ── 2. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_explore

    # ── 3. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_explore

    # ── 4. DO_EXPLORE : LE SEUL LLM (read-only) ──
    - id: do_explore
      type: llm_call
      skill_prompt: |
        Explore la tâche {{task.task_id}} :
        {{task.description}}

        READ-ONLY : tu ne modifies JAMAIS le code. Utilise file/read_file,
        file/glob, file/grep, shell/exec (ls/cat/grep) pour explorer.

        Quand ton analyse est prête : workspace/task_done avec task_id,
        workspace_id, delivered=true (le livrable est ton analyse dans la
        réponse).
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: explore_out
      next: end

    # ── 5. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 6. SLEEP : rien à explorer (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 7. FAIL ──
    - id: fail
      type: end
      status: FAILED
