name: worker
role: worker
description: "Agent worker autonome : boucle sur workspace DB, routage code/analyse/test, commit git"
personality:
  tone: professionnel
  system_prompt: |
    Tu es un agent worker autonome. Tu executes une boucle de travail :
    1. Liste les tâches pending depuis le workspace DB
    2. Claim la première tâche disponible
    3. Détermine son type : code, analyse, ou test (via son titre/tag)
    4. Exécute via un skill adapté
    5. Écrit les résultats dans l'espace projet
    6. Git add + commit + push
    7. Marque la tâche comme done (avec branch + commit_hash)
    8. Poste un message dans le chat du workspace
    9. Passe à la tâche suivante
bundles:
  - dev
  - manager
entrypoints:
  start:
    steps:
      - id: init
        type: set_variable
        name: workspace_id
        value: "{{request.workspace_id}}"
        next: agent_name_init

      - id: agent_name_init
        type: set_variable
        name: agent_name
        value: "{{agent_name}}"
        next: first_list

      - id: first_list
        type: call
        fn: workspace/task_list@v1
        inputs:
          workspace_id: "{{workspace_id}}"
        capture:
          tasks: pending_tasks
          count: task_count
        next: check_tasks

      - id: check_tasks
        type: while
        condition:
          variable: task_count
          operator: GT
          value: 0
        next: end_done
        body:
          steps:
            # --- Claim first pending task
            - id: claim_task
              type: call
              fn: workspace/task_claim@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{pending_tasks.0.id}}"
                agent_name: "{{agent_name}}"
              capture:
                ok: claimed_ok
              next: check_claimed
              on_error: skip_claim

            - id: skip_claim
              type: call
              fn: workspace/chat_post@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                content: "⚠️ {{agent_name}}: tâche {{pending_tasks.0.id}} déjà prise ou indisponible"
                msg_type: system
              capture:
                ok: skp_posted
              next: list_next

            - id: check_claimed
              type: switch
              variable: "{{claimed_ok}}"
              conditions:
                - operator: EQUALS
                  value: "true"
                  next: route_task
              default: skip_claim

            # --- Route according to task title hints
            - id: route_task
              type: call
              fn: workspace/task_get@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{pending_tasks.0.id}}"
              capture:
                task: current_task
              next: detect_type

            - id: detect_type
              type: switch
              variable: "{{current_task.title}}"
              conditions:
                - operator: CONTAINS
                  value: "[code]"
                  next: exec_code
                - operator: CONTAINS
                  value: "[analyse]"
                  next: exec_analyse
                - operator: CONTAINS
                  value: "[test]"
                  next: exec_test
              default: exec_code

            - id: exec_code
              type: call
              uses_llm: true
              fn: coding/code_gen@v1
              inputs:
                request: "{{current_task.description}}"
              capture:
                result: code_output
              next: write_code_output
              on_error: log_error

            - id: write_code_output
              type: call
              fn: project/project_write@v1
              inputs:
                project_id: "{{workspace_id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}.py"
                content: "{{code_output}}"
              capture:
                ok: file_written
              next: add_file_code

            - id: add_file_code
              type: call
              fn: workspace/task_file_add@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{current_task.id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}.py"
                role: source
              capture:
                ok: file_added
              next: git_commit_task

            - id: exec_analyse
              type: call
              uses_llm: true
              fn: coding/analyse@v1
              inputs:
                request: "{{current_task.description}}"
              capture:
                result: analysis_output
              next: write_analysis
              on_error: log_error

            - id: write_analysis
              type: call
              fn: project/project_write@v1
              inputs:
                project_id: "{{workspace_id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}.md"
                content: "{{analysis_output}}"
              capture:
                ok: file_written
              next: add_analysis_file

            - id: add_analysis_file
              type: call
              fn: workspace/task_file_add@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{current_task.id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}.md"
                role: doc
              capture:
                ok: file_added
              next: git_commit_task

            - id: exec_test
              type: call
              uses_llm: true
              fn: coding/test_runner@v1
              inputs:
                request: "{{current_task.description}}"
              capture:
                result: test_output
              next: write_test
              on_error: log_error

            - id: write_test
              type: call
              fn: project/project_write@v1
              inputs:
                project_id: "{{workspace_id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}_test.py"
                content: "{{test_output}}"
              capture:
                ok: file_written
              next: add_test_file

            - id: add_test_file
              type: call
              fn: workspace/task_file_add@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{current_task.id}}"
                path: "output/task_{{current_task.id}}_{{current_task.title | sanitize_filename}}_test.py"
                role: test
              capture:
                ok: file_added
              next: git_commit_task

            - id: git_commit_task
              type: call
              fn: git/git_add@v1
              inputs:
                project_id: "{{workspace_id}}"
              capture:
                ok: git_added
              next: git_commit

            - id: git_commit
              type: call
              fn: git/git_commit@v1
              inputs:
                project_id: "{{workspace_id}}"
                message: "{{agent_name}}: t{{current_task.id}} - {{current_task.title}}"
              capture:
                ok: committed
              next: mark_done

            - id: mark_done
              type: call
              fn: workspace/task_done@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{current_task.id}}"
              capture:
                ok: task_done
              next: chat_report

            - id: chat_report
              type: call
              fn: workspace/chat_post@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                content: "✅ {{agent_name}}: tâche #{{current_task.id}} terminée — {{current_task.title}}"
                msg_type: task_ref
              capture:
                ok: posted
              next: list_next

            - id: log_error
              type: call
              fn: workspace/chat_post@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                content: "❌ {{agent_name}}: tâche #{{current_task.id}} ({{current_task.title}}) a échoué"
                msg_type: system
              capture:
                ok: err_posted
              next: mark_done_error

            - id: mark_done_error
              type: call
              fn: workspace/task_done@v1
              inputs:
                workspace_id: "{{workspace_id}}"
                task_id: "{{current_task.id}}"
                branch: failed
              capture:
                ok: task_done_err
              next: list_next

            - id: list_next
              type: call
              fn: workspace/task_list@v1
              inputs:
                workspace_id: "{{workspace_id}}"
              capture:
                tasks: pending_tasks
                count: task_count

      - id: end_done
        type: end
        status: SUCCESS