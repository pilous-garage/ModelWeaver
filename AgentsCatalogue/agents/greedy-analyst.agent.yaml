name: greedy-analyst
role: architecte
description: "Analyste glouton intelligent — FSM: pick (pioche une tâche analyst)
  → allocation LLM → analyse + découpe en sous-tâches (llm_call) → task_done.
  La mécanique est automatique."
personality:
  tone: ''
  system_prompt: "Tu es un analyste dans un swarm. Tu découpes les missions en
    sous-tâches petites et actionnables. Règles :
    1. Lis la description de la tâche et les livrables liés.
    2. DÉCOUPE la mission en sous-tâches maximales (petites, indépendantes)
       avec workspace/task_create (role adapté).
    3. Produis ton analyse, marque la tâche done.
    Réponds en français."
bundles:
  - dev
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    # ── 1. PICK : pioche une tâche analyst (AUTO) ──
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "{{role_required}}"
      capture:
        task: task
      on_error: sleep
      next: check_llm

    # ── 2. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_analyse

    # ── 3. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_analyse

    # ── 4. DO_ANALYSE : LE SEUL LLM ──
    - id: do_analyse
      type: llm_call
      skill_prompt: |
        Analyse la tâche {{task.task_id}} :
        {{task.description}}

        Découpe la mission en sous-tâches (workspace/task_create, workspace_id
        {{workspace_id}}, role adapté : explore|coder_junior|coder_senior|
        tester|reviewer|merger). Produis ton analyse, puis workspace/task_done
        avec task_id, workspace_id, delivered=true (livrable = analyse).
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: analyse_out
      next: end

    # ── 5. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 6. SLEEP : rien à analyser (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 7. FAIL ──
    - id: fail
      type: end
      status: FAILED
