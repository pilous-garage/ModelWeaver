name: greedy-analyst
role: architecte
description: "Analyste glouton intelligent — FSM: pick (pioche un token analysis
  via token_task_pick) → allocation LLM → découpe en sous-tokens coding +
  réaffectation en merge_split (llm_call) → done. La mécanique est automatique."
personality:
  tone: ''
  system_prompt: "Tu es un analyste dans un swarm. Tu découpes les missions en
    sous-tokens petits et actionnables. Règles :
    1. Lis la description du token (analysis).
    2. DÉCOUPE en sous-tokens coding (workspace/token_task_create, task_type=
       coding, parents=[{task_id: <le token actuel>}], role adapté).
    3. RÉAFFECTE le token courant en merge_split (workspace/token_task_modify,
       new_task_type=merge_split, status=todo, parents=[les sous-tokens créés])
       — il vérifiera/mergera le travail splitté une fois les coding done.
    4. Ne marque PAS le token analysis done (il devient merge_split).
    Réponds en français."
bundles:
  - dev
generates:
  - coding
  - merge_split
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    # ── 1. PICK : pioche un token analysis (AUTO) ──
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: analysis, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: check_llm

    # ── 2. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_analyse

    # ── 3. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_analyse

    # ── 4. DO_ANALYSE : LE SEUL LLM ──
    - id: do_analyse
      type: llm_call
      skill_prompt: |
        Analyse le token {{task.task_id}} (analysis) :
        {{task.title}}
        {{task.description}}

        Découpe la mission en sous-tokens de codage :
        - workspace/token_task_create pour CHAQUE sous-token :
          { workspace_id: {{workspace_id}},
            task: {title, description, task_type: coding, difficulty, priority},
            parents: [{ task_id: {{task.task_id}}, required_state: done }] }
          (chacun parent du token courant → ils se débloquent quand tu auras
          fini l'analyse)
        - Puis RÉAFFECTE le token courant en étape de vérification/merge :
          workspace/token_task_modify (task_id={{task.task_id}},
          workspace_id={{workspace_id}}, new_task_type=merge_split,
          status=todo, parents=[{task_id: <chacun des coding créés>,
          required_state: done}])
          → le token merge_split vérifiera/mergera les sous-tokens une fois
          qu'ils seront tous done.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: analyse_out
      next: end

    # ── 5. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 6. SLEEP : rien à analyser (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 7. FAIL ──
    - id: fail
      type: end
      status: FAILED
