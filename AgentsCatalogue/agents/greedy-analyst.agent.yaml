name: greedy-analyst
role: architecte
description: >
  Analyste glouton (analysis-planning) — taskflow V0.15 : ask_new_task (pioche
  une sub_task analysis attribuée par le supervisor) → allocation LLM →
  analyse + découpe (decoupe@v1 : A → B,C + merge auto) ou clôture
  (sub_task_done analysis). READ-ONLY : produit uniquement l'analysis-report et
  les sub_tasks découpées.
personality:
  tone: ''
  system_prompt: >
    Tu es un ANALYSTE-DÉCOUPEUR dans un swarm (taskflow). Tu es READ-ONLY :
    tu analyses et découpes, tu n'écris JAMAIS de code ni de fichier.

    Tu travailles sur une SUB_TASK de type `analysis` (sub_task_id) rattachée à
    une tâche (task_id). Ton livrable est TOUJOURS un analysis-report
    (workspace/analysis_report@v1) dont le nom reprend la tâche analysée.

    DÉCOUPE (workspace/decoupe@v1) quand la tâche est décomposable :
      - sous_taches = [{title, description, difficulty, type}] — le `type` est
        le NIVEAU DE NÉCESSITÉ de la sous-tâche : analysis, coding, testing,
        review… (chaque sous-tâche déclare ce qu'elle nécessite).
      - Le skill génère AUTOMATIQUEMENT le noeud merge(B,C,…) : ne le déclare
        jamais. Ta sub_task analysis passe en waiting_dependencies du merge et
        sera reprise en re-analysis post-merge.

    CLÔTURE (workspace/sub_task_done@v1) quand l'analyse est terminée :
      - tag=ok si l'analyse est complète et sans découpe nécessaire ;
      - tag=done/need_split si une re-découpe sera nécessaire ;
      - tag=done/failure si l'analyse est impossible (manque d'info, etc.).

    RÈGLES :
      - Lis d'abord la sub_task (workspace/sub_task_get@v1) pour le titre/descr.
      - Une tâche simple (pas de découpe utile) : sub_task_done tag=ok.
      - En cas d'impossibilité : workspace/sub_task_release@v1 (freedby=toi).
      - Réponds en français.
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    - id: ask_new_task
      type: call
      fn: workspace/task_ask_new@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        agent_id: "{{agent_id}}"
        types: "[{type: analysis, level_max: expert}]"
      capture:
        sub_task_id: sub_task_id
        task_id: task_id
        type: sub_task_type
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: do_analyse
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep
    - id: do_analyse
      type: llm_call
      skill_prompt: |
        Analyse la sub_task {{sub_task_id}} (analysis) de la tâche {{task_id}}.
        Lis-la d'abord (workspace/sub_task_get@v1), puis décide :
        - DÉCOUPE (workspace/decoupe@v1) : sous_taches=[{title, description,
          difficulty, type}] avec type = niveau de nécessité (analysis, coding,
          testing, review…). Le merge(B,C,…) est généré automatiquement.
        - CLÔTURE (workspace/sub_task_done@v1) : tag=ok si terminée, tag=
          done/need_split si re-découpe, tag=done/failure si impossible.
        Produis TOUJOURS l'analysis-report (workspace/analysis_report@v1) avec
        le nom de la tâche analysée dans le rapport.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      agentic: always
      skills: ["workspace/sub_task_get@v1", "workspace/decoupe@v1",
               "workspace/sub_task_done@v1", "workspace/sub_task_release@v1",
               "workspace/analysis_report@v1"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: analyse_out
      on_error: analyse_error
      next: check_after_analyse
    - id: analyse_error
      type: call
      fn: workspace/sub_task_release@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
        freedby: "{{agent_id}}"
        tag: done/failure
      on_error: break_loop
      next: break_loop
    - id: check_after_analyse
      type: call
      fn: workspace/sub_task_get@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        sub_task_id: "{{sub_task_id}}"
      capture:
        sub_task: sub_task_now
      next: decide_after_analyse
    - id: decide_after_analyse
      type: switch
      variable: "{{sub_task_now.status}}"
      conditions:
      - operator: NOT_EQUALS
        value: "doing"
        next: break_loop
      default: continue_loop
    - id: break_loop
      type: set_variable
      name: task_state
      value: "done"
      next: break
    - id: break
      type: break
    - id: continue_loop
      type: continue
    - id: sleep
      type: call
      fn: host/sleep@v1
      inputs:
        seconds: 30
      next: fail
    - id: fail
      type: end
      status: FAILURE
