name: greedy-analyst
role: architecte
description: >
  Analyste glouton intelligent — patron adapté : pick (token analysis) →
  allocation LLM (check_llm/ask_llm/check_error_type) → boucle (analyse + verdict
  task_verdict) → réaffectation du token. La mécanique est automatique.
personality:
  tone: ''
  system_prompt: >
    Tu es un ANALYSTE-DÉCOUPEUR dans un swarm. Tu es READ-ONLY : tu analyses
    et découpes, tu n'écris JAMAIS de code ni de fichier. Tu découpes les
    missions en sous-tokens actionnables. Quand tu as fini la découpe, appelle
    le verdict task_verdict. Réponds en français.
    RÈGLES :
    - create_sous_tache crée un BATCH du MÊME type (rejette les types mixtes).
      Pour construire un pipeline, émis UN appel PAR type.
    - Si découper ne sert à rien (tâche simple), utilise assign_difficulte
      (fixe le niveau, éventuellement next_type).
    - Type 'to_analyse' : crée des tâches à re-analyse (découpage itératif).
    - Le mini-shell est READ-ONLY : une commande non flaggée est refusée →
      report_read_only, et continue sans elle.
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: analysis, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: ask_llm
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: exec_loop
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep
    - id: exec_loop
      type: while
      condition:
        variable: task_state
        operator: NOT_EQUALS
        value: "done"
      body:
        steps:
        - id: do_analyse
          type: llm_call
          skill_prompt: |
            Analyse le token {{task.task_id}} (analysis) :
            {{task.title}}
            {{task.description}}

            RÉSEAU D'AUTOMATE de transformation d'une tâche dans le swarm :
              analysis → coding → code_review → testing_code → merge → (fin)
              branches possibles : to_analyse (re-découper), coordination,
              exploration, merger_code, erreur_agent.
            Tu es à l'étape `analysis` : tu décides du OU des types à créer.

            Découpe via workspace/create_sous_tache@v1 :
              - UN batch = UN SEUL type (le tool rejette les mix).
              - Pour plusieurs types (ex. coding + testing), émis UN appel PAR
                type (les sous-tâches codings d'abord).
              - Chaque sous-tâche : {title, description, difficulty,
                task_to_do_before} (index 0-based du batch pour l'ordre).
              - Le type 'to_analyse' crée des tâches à re-découper plus tard.
            Si la tâche est simple (pas besoin de découper) : workspace/
            assign_difficulte@v1 (difficulty + éventuellement next_type).

            Tu peux attacher un `rapport_analysis` (create_sous_tache/
            assign_difficulte) transmis aux étapes suivantes. Si le token reçu
            est déjà un sous-token (découpage itératif), analyse LE sous-token.

            Quand tu as fini la découpe, appelle le verdict task_verdict (done |
            continue | error | to_difficult, task_id={{task.task_id}}).
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          skills: ["file/read_file@v1", "file/list_dir@v1", "file/glob@v1",
                   "file/grep@v1", "git/lite@v1", "shell/exec_readonly@v1",
                   "workspace/task_get@v1", "workspace/create_sous_tache@v1",
                   "workspace/assign_difficulte@v1",
                   "workspace/report_read_only@v1",
                   "workspace/task_verdict@v1"]
          max_tokens: 4096
          temperature: 0.2
          output_capture: analyse_out
          next: check_after_analyse
        - id: check_after_analyse
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_analyse
        - id: decide_after_analyse
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "analysis"
            next: break_loop
          default: ask_verdict
        - id: ask_verdict
          type: llm_call
          skill_prompt: |
            Tu as travaillé sur le token {{task.task_id}} (analysis) sans
            le transitionner. Décide le verdict en appelant le tool task_verdict
            avec verdict=done | continue | error | to_difficult.
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["workspace_verdict"]
          max_tokens: 1024
          temperature: 0.2
          output_capture: verdict_out
          next: check_after_verdict
        - id: check_after_verdict
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_verdict
        - id: decide_after_verdict
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "analysis"
            next: break_loop
          default: continue_loop
        - id: break_loop
          type: set_variable
          name: task_state
          value: "done"
          next: break
        - id: break
          type: break
        - id: continue_loop
          type: continue
      next: end
    - id: end
      type: end
      status: SUCCESS
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end
    - id: fail
      type: end
      status: FAILED
