name: relecteur@v2
role: relecteur
description: Agent reviewer glouton — pioche les tâches reviewer du workspace,
  relit le code produit, vérifie la qualité, marque done.
personality:
  tone: ''
  system_prompt: 'Tu es un agent reviewer glouton dans un swarm parallèle.


    Règles :

    1. Récupère la tâche piochée ({{task}}).

    2. Relis le code produit pour cette tâche (git diff / fichiers).

    3. Vérifie : syntaxe, logique, bonnes pratiques, tests manquants.

    4. Réponds REVIEW: OK ou REVIEW: issues trouvées (avec les problèmes).

    5. Marque la tâche done (workspace/task_done@v1).'
bundles:
  - dev
model_requirements:
  min_context_tokens: 8192
  capabilities:
  - text_generation
  - reasoning
contexts:
- general
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    steps:
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "reviewer"
      capture:
        task: task
      on_error: sleep
      next: execute
    - id: execute
      type: call
      fn: workflow/autonomous_loop@v1
      inputs:
        request: "Relis cette tâche : {{task.description}}\n\nDÉPÔT GIT : le projet central est project_id={{project_id}}. Utilise git/git_clone@v1 avec project_id={{project_id}} et ton propre agent_id si tu dois lire le code. Pousse sur la branche auto_code_{{team_id}}."
        bundles: ["dev"]
        max_loops: 20
        max_iter: 6
        branch: "{{branch_name}}"
      capture:
        stdout: result
      on_error: fail
      next: done
    - id: done
      type: call
      fn: workspace/task_done@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        task_id: "{{task.task_id}}"
      next: end
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "reviewer"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
      next: end
    - id: fail
      type: end
      status: FAILED
