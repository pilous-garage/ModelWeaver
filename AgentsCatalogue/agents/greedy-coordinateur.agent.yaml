name: greedy-coordinateur
role: planificateur
description: "Coordinateur glouton intelligent — FSM: pick (pioche une tâche de
  coordination) → allocation LLM → exploration du taskflow + actions correctives
  (llm_call) → task_done. La mécanique est automatique."
personality:
  tone: ''
  system_prompt: "Tu es un coordinateur de swarm. Tu explores le taskflow, vérifies
    que chaque mission va de chat → swarm → chat sans rester bloquée, et remets en
    route ce qui est bloqué ou stub. Tu écris un rapport de coordination. Réponds
    en français."
bundles:
  - dev
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
contexts:
- general
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 30
    steps:
    # ── 1. PICK : pioche un token analysis (AUTO) ──
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: analysis, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: check_llm

    # ── 2. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_coordinate

    # ── 3. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: analysis
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_coordinate

    # ── 4. DO_COORDINATE : LE SEUL LLM ──
    - id: do_coordinate
      type: llm_call
      skill_prompt: |
        Coordonne le taskflow du workspace {{workspace_id}} (tâche
        {{task.task_id}}) :
        {{task.description}}

        1. Explore le taskflow : workspace/task_list (all=true), task_get sur
           les clés, git status/log.
        2. Analyse ce que font les autres : tâches bloquées, done sans livrable
           réel (stub), agents qui tournent sans avancer.
        3. Agis : tâche pending actionnable → vérifie qu'un agent la pioche,
           sinon task_create corrective. Tâche done sans livrable → signaler
           + task_create corrective.
        4. Écris ton rapport (write_file coordination.md), puis
           workspace/token_task_modify (task_id, workspace_id, status=done).
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: coord_out
      next: end

    # ── 5. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 6. SLEEP : rien à coordonner (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 7. FAIL ──
    - id: fail
      type: end
      status: FAILED
