name: greedy-reviewer
role: relecteur
description: >
  Relecteur glouton intelligent — patron adapté : pick (code_review) →
  resolve_repo → clone/checkout (commit livré) → allocation LLM → boucle review
  (llm_call + verdict task_verdict) → transition vers merger_code ou coding correctif.
personality:
  tone: ''
  system_prompt: >
    Tu es un relecteur dans un swarm. Tu valides les tokens livrés en code_review.
    Quand tu as fini la relecture, appelle le verdict task_verdict (done | continue | error | to_difficult).
    Réponds en français, code en anglais.
bundles:
  - dev
generates:
  - merger_code
  - coding
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 40
    steps:
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: code_review, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: resolve_repo
    - id: resolve_repo
      type: switch
      variable: "{{task.repo}}"
      conditions:
      - operator: CONTAINS
        value: "{{"
        next: repo_default
      - operator: EQUALS
        value: ""
        next: repo_default
      default: repo_task
    - id: repo_default
      type: set_variable
      name: repo_eff
      value: "{{project_id}}"
      next: clone
    - id: repo_task
      type: set_variable
      name: repo_eff
      value: "{{task.repo}}"
      next: clone
    - id: clone
      type: call
      fn: git/git_clone@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
      on_error: fail
      next: checkout
    - id: checkout
      type: call
      fn: git/git_checkout@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
        name: "{{task.commit_hash}}"
      next: check_llm
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: exec_loop
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding_high
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: llm_error
      next: exec_loop
    - id: llm_error
      type: call
      fn: workflow/check_error_type@v1
      inputs:
        error: "{{_last_call_error}}"
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        action: err_action
      next: err_branch
    - id: err_branch
      type: switch
      variable: "{{err_action}}"
      conditions:
      - operator: EQUALS
        value: "blacklist_provider"
        next: fail
      - operator: EQUALS
        value: "context_reduce"
        next: ask_llm
      - operator: EQUALS
        value: "switch_model"
        next: ask_llm
      default: sleep
    - id: exec_loop
      type: while
      condition:
        variable: task_state
        operator: NOT_EQUALS
        value: "done"
      body:
        steps:
        - id: do_review
          type: llm_call
          skill_prompt: |
            Relis le token {{task.task_id}} (code_review) dans le clone
            agents/{{agent_id}}/workspace/{{repo_eff}} au commit {{task.commit_hash}}.

            Vérifie le code, puis appelle le verdict task_verdict (done | continue
            | error | to_difficult, task_id={{task.task_id}}).
            Si problèmes : crée une tâche corrective (workspace/task_create, coding)
            et laisse le token en code_review (workspace/token_task_modify).
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["dev"]
          max_tokens: 4096
          temperature: 0.2
          output_capture: review_out
          next: check_after_review
        - id: check_after_review
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_review
        - id: decide_after_review
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "code_review"
            next: break_loop
          default: ask_verdict
        - id: ask_verdict
          type: llm_call
          skill_prompt: |
            Tu as travaillé sur le token {{task.task_id}} (code_review) sans
            le transitionner. Décide le verdict en appelant le tool task_verdict
            avec verdict=done | continue | error | to_difficult.
          provider_ref: "{{_llm_provider}}"
          model_ref: "{{_llm_model}}"
          bundles: ["workspace_verdict"]
          max_tokens: 1024
          temperature: 0.2
          output_capture: verdict_out
          next: check_after_verdict
        - id: check_after_verdict
          type: call
          fn: workspace/task_get@v1
          inputs:
            workspace_id: "{{workspace_id}}"
            task_id: "{{task.task_id}}"
          capture:
            task: task_now
          next: decide_after_verdict
        - id: decide_after_verdict
          type: switch
          variable: "{{task_now.task_type}}"
          conditions:
          - operator: NOT_EQUALS
            value: "code_review"
            next: break_loop
          default: continue_loop
        - id: break_loop
          type: set_variable
          name: task_state
          value: "done"
          next: break
        - id: break
          type: break
        - id: continue_loop
          type: continue
      next: end
    - id: end
      type: end
      status: SUCCESS
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end
    - id: fail
      type: end
      status: FAILED
