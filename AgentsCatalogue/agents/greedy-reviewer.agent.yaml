name: greedy-reviewer
role: relecteur
description: "Relecteur glouton intelligent — FSM: pick (pioche une tâche en
  review) → clone (repo de la tâche) → checkout (commit/branche livrés) →
  allocation LLM → boucle de review (llm_call, lit les vrais fichiers) →
  task_done (approve) ou tâche corrective. La mécanique est automatique."
personality:
  tone: ''
  system_prompt: "Tu es un relecteur dans un swarm. Tu valides les tâches livrées
    en review. Règles :
    1. Lis la description de la tâche et les fichiers livrés (le clone git de
       ton workspace contient le code au bon commit).
    2. Relis réellement : qualités du code, respect de la description, tests.
    3. Si OK : task_done avec approve=true (le FSM fait le reste).
       Si problèmes : task_create d'une tâche corrective, puis task_done avec
       approve=false (ou laisse en review).
    Réponds en français."
bundles:
  - dev
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 40
    steps:
    # ── 1. PICK : pioche une tâche en review (AUTO) ──
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "{{role_required}}"
        status: "review"
      capture:
        task: task
      on_error: sleep
      next: clone

    # ── 2. CLONE : le repo de la tâche (AUTO) ──
    - id: clone
      type: call
      fn: git/git_clone@v1
      inputs:
        project_id: "{{task.repo}}"
        agent_id: "{{agent_id}}"
      on_error: fail
      next: checkout

    # ── 3. CHECKOUT : le commit/branche livré par le coder (AUTO) ──
    - id: checkout
      type: call
      fn: git/git_checkout@v1
      inputs:
        project_id: "{{task.repo}}"
        agent_id: "{{agent_id}}"
        name: "{{task.commit_hash}}"
      next: check_llm

    # ── 4. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_review

    # ── 5. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding_high
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_review

    # ── 6. DO_REVIEW : LE SEUL LLM ──
    - id: do_review
      type: llm_call
      skill_prompt: |
        Relis la tâche {{task.task_id}} :
        {{task.description}}

        Le code livré est dans ton clone agents/{{agent_id}}/workspace/{{task.repo}}
        au commit {{task.commit_hash}}.

        Actions possibles (tools du bundle dev) :
        - file/read_file : relis les vrais fichiers.
        - workspace/task_get : statut/commit de la tâche.
        - Si le code est bon : workspace/task_done avec task_id, workspace_id,
          approve=true, branch={{task.branch}}, commit_hash={{task.commit_hash}}.
        - Si problèmes : workspace/task_create (tâche corrective, role_required
          adapté), puis task_done approve=false.
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: review_out
      next: end

    # ── 7. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 8. SLEEP : rien à reviewer (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 9. FAIL ──
    - id: fail
      type: end
      status: FAILED
