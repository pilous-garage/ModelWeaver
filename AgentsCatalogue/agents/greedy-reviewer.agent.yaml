name: greedy-reviewer
role: relecteur
description: "Relecteur glouton intelligent — FSM: pick (pioche un token code_review
  via token_task_pick) → clone (repo du token) → checkout (commit livré) →
  allocation LLM → boucle de review (llm_call, lit les vrais fichiers) →
  transition du token (code_review → merger_code). La mécanique est automatique."
personality:
  tone: ''
  system_prompt: "Tu es un relecteur dans un swarm. Tu valides les tokens livrés
    en code_review. Règles :
    1. Lis la description du token et les fichiers livrés (le clone git de ton
       workspace contient le code au bon commit).
    2. Relis réellement : qualités du code, respect de la description, tests.
    3. Si OK : token_task_modify (task_id, new_task_type=merger_code,
       status=todo) — la mécanique est automatique.
       Si problèmes : token_task_create d'une tâche corrective, puis laisse le
       token en code_review (ou modify vers coding pour re-travail).
    Réponds en français."
bundles:
  - dev
generates:
  - merger_code
  - coding
model_requirements:
  min_context_tokens: 32768
  capabilities:
  - text_generation
  - code_generation
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    max_iterations: 40
    steps:
    # ── 1. PICK : pioche un token code_review (AUTO) ──
    - id: pick
      type: call
      fn: workspace/token_task_pick@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
        task_types: "[{type: code_review, max_difficulty: expert}]"
      capture:
        task: task
      on_error: sleep
      next: resolve_repo

    # ── 1b. RESOLVE_REPO ──
    - id: resolve_repo
      type: switch
      variable: "{{task.repo}}"
      conditions:
      - operator: CONTAINS
        value: "{{"
        next: repo_default
      - operator: EQUALS
        value: ""
        next: repo_default
      default: repo_task
    - id: repo_default
      type: set_variable
      name: repo_eff
      value: "{{project_id}}"
      next: clone
    - id: repo_task
      type: set_variable
      name: repo_eff
      value: "{{task.repo}}"
      next: clone

    # ── 2. CLONE (AUTO) ──
    - id: clone
      type: call
      fn: git/git_clone@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
      on_error: fail
      next: checkout

    # ── 3. CHECKOUT : le commit livré par le coder (AUTO) ──
    - id: checkout
      type: call
      fn: git/git_checkout@v1
      inputs:
        project_id: "{{repo_eff}}"
        agent_id: "{{agent_id}}"
        name: "{{task.commit_hash}}"
      next: check_llm

    # ── 4. CHECK_LLM (AUTO) ──
    - id: check_llm
      type: call
      fn: workflow/check_llm@v1
      inputs:
        provider_ref: "{{_llm_provider}}"
        model_ref: "{{_llm_model}}"
      capture:
        has_llm: has_llm
      on_error: ask_llm
      next: do_review

    # ── 5. ASK_LLM (AUTO) ──
    - id: ask_llm
      type: call
      fn: workflow/ask_llm@v1
      inputs:
        use_case: coding_high
        agent_id: "{{agent_id}}"
      capture:
        provider_ref: _llm_provider
        model_ref: _llm_model
      on_error: fail
      next: do_review

    # ── 6. DO_REVIEW : LE SEUL LLM ──
    - id: do_review
      type: llm_call
      skill_prompt: |
        Relis le token {{task.task_id}} (code_review) :
        {{task.title}}
        {{task.description}}

        Le code livré est dans ton clone agents/{{agent_id}}/workspace/{{repo_eff}}
        au commit {{task.commit_hash}}.

        Actions possibles (tools du bundle dev) :
        - file/read_file : relis les vrais fichiers.
        - workspace/task_get : statut/commit du token.
        - Si le code est bon : workspace/token_task_modify avec task_id,
          workspace_id, new_task_type=merger_code, status=todo (transition
          automatique vers la fusion).
        - Si problèmes : workspace/token_task_create (tâche corrective coding),
          puis token_task_modify (task_id, new_task_type=coding, status=todo).
      provider_ref: "{{_llm_provider}}"
      model_ref: "{{_llm_model}}"
      bundles: ["dev"]
      max_tokens: 4096
      temperature: 0.2
      output_capture: review_out
      next: end

    # ── 7. FIN ──
    - id: end
      type: end
      status: SUCCESS

    # ── 8. SLEEP : rien à reviewer (AUTO) ──
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "{{role_required}}"
        team_id: "{{team_id}}"
        agent_id: "{{agent_id}}"
      next: end

    # ── 9. FAIL ──
    - id: fail
      type: end
      status: FAILED
