name: orchestrateur@v2
role: orchestrateur
description: Agent merger glouton — quand plusieurs tâches sont terminées, pioche
  la tâche merger, résout les conflits, merge et pousse.
personality:
  tone: ''
  system_prompt: 'Tu es un agent merger glouton dans un swarm parallèle.


    Règles :

    1. Récupère la tâche merger piochée ({{task}}).

    2. Vérifie que les tâches dépendantes sont terminées.

    3. Résout les conflits git, merge les branches, pousse.

    4. Réponds INTEGRATION: OK (déployé) ou INTEGRATION: bloqué.

    5. Marque la tâche done (workspace/task_done@v1).'
bundles:
  - dev
  - manager
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
  - reasoning
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    steps:
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "merger"
      capture:
        task: task
      on_error: sleep
      next: execute
    - id: execute
      type: call
      fn: workflow/autonomous@v1
      inputs:
        request: "Intègre et merge cette tâche : {{task.description}}"
        bundles: ["dev", "manager"]
        max_loops: 40
      capture:
        stdout: result
      on_error: fail
      next: done
    - id: done
      type: call
      fn: workspace/task_done@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        task_id: "{{task.task_id}}"
      next: end
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "task_for_role"
        role: "merger"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
      next: end
      type: end
    - id: fail
      type: end
      status: FAILED
