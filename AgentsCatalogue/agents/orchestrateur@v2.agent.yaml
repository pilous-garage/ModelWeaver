name: orchestrateur@v2
role: orchestrateur
description: Agent merger/integrateur glouton — quand toutes les tâches d'un
  workspace sont terminées, pousse le travail sur la branche auto_code_<team_id>.
  Intègre aussi les tâches merger si l'analyste en crée.
personality:
  tone: ''
  system_prompt: 'Tu es l''agent merger/integrateur d''un swarm parallèle.

    Règles :

    1. Si tu as pioché une tâche merger ({{task}}), vérifie que les dépendances
       sont terminées, résous les conflits git, merge, puis pousse.

    2. À la FIN d''un workspace (toutes les tâches done), pousse TOUJOURS sur la
       branche auto_code_<team_id> — jamais sur la branche principale.

    3. Réponds INTEGRATION: OK (déployé) ou INTEGRATION: bloqué.'
bundles:
  - dev
  - manager
model_requirements:
  min_context_tokens: 16384
  capabilities:
  - text_generation
  - reasoning
contexts:
- general
- project:modelweaver
default_config:
  temperature: 0.2
  max_tokens: 4096
entrypoints:
  main:
    steps:
    - id: route
      type: switch
      variable: "{{request}}"
      conditions:
      - operator: CONTAINS
        value: "workspace done"
        next: push_auto
      default: pick
    - id: pick
      type: call
      fn: workspace/task_claim_next@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        role_required: "merger"
      capture:
        task: task
      on_error: sleep
      next: execute
    - id: execute
      type: call
      fn: workflow/autonomous_loop@v1
      inputs:
        request: "Intègre et merge cette tâche : {{task.description}}"
        bundles: ["dev", "manager"]
        max_loops: 40
        max_iter: 8
        branch: "{{branch_name}}"
      capture:
        stdout: result
      on_error: fail
      next: done
    - id: done
      type: call
      fn: workspace/task_done@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        task_id: "{{task.task_id}}"
      next: push_auto
    - id: sleep
      type: call
      fn: workspace/wait_for@v1
      inputs:
        workspace_id: "{{workspace_id}}"
        type: "workspace_all_done"
        agent_id: "{{agent_id}}"
        team_id: "{{team_id}}"
      next: end
    - id: push_auto
      type: call
      fn: git/git_push_remote@v1
      inputs:
        project_id: "{{project_id}}"
        branch: "auto_code_{{team_id}}"
        agent_id: "{{agent_id}}"
      next: sleep
    - id: fail
      type: end
      status: FAILED
